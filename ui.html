<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src https: http: data: my:">
<style>
/* slim themed scrollbars */
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--muted, #888) 38%, transparent); border-radius:10px; border:3px solid transparent; background-clip:content-box; min-height:36px; }
  ::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--accent, #7aa2f7) 70%, transparent); background-clip:content-box; }
  ::-webkit-scrollbar-corner { background:transparent; }
  
  :root { --bg:#1e1f22; --tab:#2b2d31; --active:#3a3d44; --fg:#e6e6e6; --muted:#9aa0a6; --line:#34363b; --accent:#7aa2f7; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:13px system-ui, sans-serif; user-select:none; overflow:hidden; }
  body.part-tabs #bar, body.part-toolbar #tabs { display:none; }
  body.part-status #tabs, body.part-status #bar { display:none; }
  body.part-tabs #status, body.part-toolbar #status { display:none; }

  /* ---- tab strip (horizontal) ---- */
  #tabs { display:flex; gap:2px; padding:0 6px 0 0; height:38px; align-items:flex-end; overflow:hidden; }
  #tabs-menu-btn { flex:none; display:flex; align-items:center; justify-content:center;
    width:36px; height:38px; padding:0; border:0; background:none; cursor:pointer;
    color:var(--muted); -webkit-app-region:no-drag; }
  #tabs-menu-btn:hover { color:var(--fg); }
  #tabs-menu-btn img { width:18px; height:18px; border-radius:3px; object-fit:contain; display:block; }
  #tabs-wrap { flex:1; min-width:0; display:flex; gap:2px; align-items:flex-end; overflow-x:auto; overflow-y:hidden;
    padding:6px 0 0; scrollbar-width:none; }
  #tabs-wrap::-webkit-scrollbar { display:none; }
  /* a tab is being dragged over this window: show where it will land */
  body.dropping::after { content:''; position:fixed; inset:0; border:2px solid var(--accent); border-radius:8px; pointer-events:none; z-index:50; background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .tab.dropbefore::before { content:''; position:absolute; left:-3px; top:6px; bottom:6px; width:3px; border-radius:2px; background:var(--accent); }
  .tab { position:relative; display:flex; align-items:center; gap:6px; flex:0 1 200px; min-width:42px; max-width:200px;
    height:32px; padding:0 8px; background:var(--tab); border-radius:8px 8px 0 0; cursor:default; transition:min-width .15s, max-width .15s; }
  .tab.active { background:var(--active); }
  .tab.pinned { flex:0 0 38px; min-width:38px; padding:0; justify-content:center; }
  .tab.private::after { content:""; position:absolute; left:8px; right:8px; bottom:0; height:2px; background:#b57bee; border-radius:2px; }
  .tab .ico { width:16px; height:16px; flex:none; border-radius:3px; display:grid; place-items:center;
    font-size:10px; background:var(--line); color:var(--muted); object-fit:cover; }
  .tab.loading .ico { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .tab .t { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .tab .x, .tab .snd { background:none; border:0; color:var(--muted); cursor:pointer; padding:0 2px; font-size:13px; }
  .tab .x:hover, .tab .snd:hover { color:var(--fg); }
  .tab.pinned .t, .tab.pinned .x { display:none; }
  #newtab { background:none; border:0; color:var(--muted); font-size:18px; cursor:pointer; padding:0 8px; height:32px; flex:none; }
  #newtab:hover { color:var(--fg); }

  /* compact tab strip: when many tabs and horizontal, shrink close button */
  #tabs-wrap.compact .tab .x { display:none; }

  /* ---- vertical mode ---- */
  body.vertical #tabs { flex-direction:column; height:100%; padding:6px; gap:2px; align-items:stretch; overflow-y:auto; overflow-x:hidden; }
  body.vertical #tabs-menu-btn { width:100%; justify-content:flex-start; padding:0 8px; }
  body.vertical #tabs-wrap { flex-direction:column; overflow:visible; padding:0; }
  body.vertical .tab { flex:none; max-width:none; border-radius:6px; height:32px; }
  body.vertical .tab.pinned { flex:none; justify-content:flex-start; padding:0 8px; }
  body.vertical .tab.pinned .t { display:block; }
  body.vertical #newtab { text-align:left; height:32px; }

  /* ---- toolbar ---- */
  #bar { display:flex; gap:6px; padding:6px 6px 0; background:var(--active); height:50px; align-items:center; position:relative; }
  #dl-bar { position:absolute; bottom:0; left:0; height:3px; background:var(--accent); width:0%; transition:width .3s ease; opacity:0; pointer-events:none; }
  #dl-bar.active { opacity:1; }
  #bar button { background:none; border:0; color:var(--fg); font-size:16px; min-width:34px; height:34px;
    border-radius:6px; cursor:pointer; position:relative; }
  #bar button:hover:not(:disabled) { background:var(--tab); }
  #bar button:disabled { opacity:.35; cursor:default; }
  #bar button.nav { min-width:40px; height:38px; border-radius:10px; display:grid; place-items:center; }
  #bar button.nav svg { width:22px; height:22px; display:block; }
  #urlwrap { flex:1; display:flex; align-items:center; height:36px; border:1px solid transparent; border-radius:18px;
    background:var(--bg); min-width:0; position:relative; overflow:hidden; }
  #urlprog { position:absolute; left:0; top:0; bottom:0; width:0; background:color-mix(in srgb, var(--accent) 28%, transparent); pointer-events:none; opacity:0; transition:width .25s ease-out, opacity .3s ease; }
  #urlwrap:focus-within { border-color:var(--accent); }
  #url { flex:1; min-width:0; height:34px; border:0; padding:0 14px 0 4px; background:transparent; color:var(--fg);
    font:inherit; outline:none; }
  #bar #sec { height:24px; min-width:0; margin-left:6px; padding:0 8px; border-radius:12px; font-size:13px; display:flex; align-items:center; gap:4px; }
  #sec .lbl { font-size:12px; }
  #bar #eng { display:none; position:relative; width:26px; height:26px; min-width:26px; margin-left:6px; padding:0; border-radius:50%; place-items:center; overflow:hidden; }
  #urlwrap:focus-within #eng, body.eng-always #eng { display:grid; }
  #eng img { width:18px; height:18px; border-radius:4px; display:none; }
  #eng.pic img { display:block; } #eng.pic #engl { display:none; }
  #engl { width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--onaccent); font-size:11px; font-weight:700; display:grid; place-items:center; }
  #sec.secure { color:#4cc38a; }
  #sec.insecure { color:#e8a33d; }
  #sec.warning { color:#e5534b; }
  #sec.internal { color:var(--muted); }
  .ic svg { width:18px; height:18px; display:block; margin:auto; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #bar button.ic { display:grid; place-items:center; }
  #exts { display:flex; align-items:center; gap:2px; order:40; }
  #exts button { min-width:34px; height:34px; border-radius:9px; display:grid; place-items:center; padding:0; }
  #exts img { width:20px; height:20px; display:block; }
  #exts .xl { width:20px; height:20px; border-radius:5px; background:var(--accent); color:var(--onaccent); font-size:12px; font-weight:700; display:grid; place-items:center; }
  #star.on svg { fill:var(--accent); stroke:var(--accent); }
  #shield.off svg { opacity:.45; }
  #key .n { display:none; }
  #shield .n, #key .n { position:absolute; right:-2px; top:-3px; font-size:9px; background:var(--accent); color:var(--onaccent); border-radius:8px; padding:0 4px; }
  #bar #key { display:none; position:relative; height:28px; min-width:28px; margin-right:6px; border-radius:50%; color:var(--muted); }
  #bar #key.show { display:grid; }
  #bar #key.has { color:var(--accent); }
  #sec .ic svg, #sec svg { width:16px; height:16px; }
  #winbar .ic svg { width:15px; height:15px; }
  #pchip { display:grid; place-items:center; width:26px; height:26px; border-radius:50%; font-size:13px; font-weight:700; color:#fff; background:var(--accent); }
  /* hide toolbar buttons per settings */
  .tb-hidden { display:none !important; }

  /* ---- default browser bar ---- */
  #default-bar { display:none; align-items:center; gap:8px; padding:0 10px; height:34px;
    background:color-mix(in srgb, var(--accent) 12%, var(--active)); border-top:1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    font-size:13px; color:var(--fg); }
  #default-bar.show { display:flex; }
  #default-bar .df-msg { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #default-bar button { border:0; border-radius:6px; cursor:pointer; font-size:12px; padding:3px 10px; font-family:inherit; background:transparent; color:var(--muted); }
  #default-bar button:hover { background:var(--tab); color:var(--fg); }
  #default-bar #df-set { background:var(--accent); color:var(--onaccent); }
  #default-bar #df-set:hover { opacity:.85; background:var(--accent); color:var(--onaccent); }
  #default-bar #df-close { font-size:16px; min-width:24px; }

  /* ---- translate bar ---- */
  #translate-bar { display:none; align-items:center; gap:8px; padding:0 10px; height:34px;
    background:color-mix(in srgb, var(--accent) 12%, var(--active)); border-top:1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    font-size:13px; color:var(--fg); }
  #translate-bar.show { display:flex; }
  #translate-bar .tl-msg { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #translate-bar button { border:0; border-radius:6px; cursor:pointer; font-size:12px; padding:3px 10px; font-family:inherit; }
  #translate-bar #tl-btn { background:var(--accent); color:var(--onaccent); }
  #translate-bar #tl-btn:hover { opacity:.85; }
  #translate-bar #tl-close { background:transparent; color:var(--muted); font-size:16px; min-width:24px; }
  #translate-bar #tl-close:hover { background:var(--tab); color:var(--fg); }

  /* ---- tab list arrow + window controls (top right) ---- */
  #winbar { position:absolute; right:0; top:0; display:flex; align-items:center; gap:2px; padding:0 6px; z-index:3; }
  body.part-status #winbar { display:none; }
  body.part-tabs.vertical #winbar, body.part-toolbar:not(.vertical) #winbar { display:none; }
  body.part-tabs #winbar { height:38px; }
  body.part-toolbar #winbar { height:50px; }
  #winbar button { background:none; border:0; color:var(--muted); border-radius:6px; height:28px; min-width:30px; cursor:pointer; font-size:14px; }
  #winbar button:hover { background:var(--tab); color:var(--fg); }
  #wc { display:none; margin-left:4px; }
  body.frameless #wc { display:flex; gap:2px; }
  #wclose:hover { background:#e5484d !important; color:#fff !important; }
  body.part-tabs:not(.vertical) #tabs-wrap { margin-right:46px; }
  body.part-tabs.frameless:not(.vertical) #tabs-wrap { margin-right:150px; }
  body.part-toolbar.vertical #bar { padding-right:46px; }
  body.part-toolbar.vertical.frameless #bar { padding-right:150px; }

  /* ---- dragging the window by its tab strip / toolbar (frameless) ---- */
  body.frameless.part-tabs #tabs, body.frameless.part-toolbar.vertical #bar { -webkit-app-region:drag; }
  body.frameless .tab, body.frameless #newtab, body.frameless #winbar, body.frameless #bar button,
  body.frameless #urlwrap, body.frameless #tabs button, body.frameless #tabs-menu-btn { -webkit-app-region:no-drag; }

  /* ---- status bar ---- */
  #status { display:flex; align-items:center; gap:12px; height:100%; padding:0 10px; background:var(--active);
    border-top:1px solid var(--line); font-size:13px; color:var(--muted); white-space:nowrap; }
  #status .grow { flex:1; overflow:hidden; text-overflow:ellipsis; }
  #status .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 1s infinite; }
  #status button { background:none; border:0; color:var(--muted); font-size:12px; padding:0 4px; cursor:pointer; }
  #status button:hover { color:var(--fg); }
  #st-cog { font-size:14px !important; padding:0 2px !important; }
  #st-lock { padding:0 2px !important; display:flex; align-items:center; }
  #status #st-home { border-radius:9px; padding:1px 9px !important; font-size:11px !important; font-weight:600; border:1px solid var(--line); }
  #status #st-home.on { background:#f5a524; color:#1b1200; border-color:#f5a524; }
  #st-lock svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #st-time { font-size:11px; letter-spacing:.03em; }
  #st-zoom-wrap { display:flex; align-items:center; gap:4px; }
  #st-zoom-range { width:72px; height:3px; accent-color:var(--accent); cursor:pointer; }
  #st-zoom-pct { font-size:11px; min-width:34px; text-align:right; cursor:pointer; }
  #update-pill { display:none; align-items:center; gap:5px; background:var(--accent); color:var(--onaccent);
    border-radius:10px; padding:1px 8px 1px 6px; font-size:11px; cursor:pointer; white-space:nowrap; transition:background .3s; }
  #update-pill:hover { opacity:.88; }
  #update-pill.ready { background:#3ba55c; }
  #update-pill.downloading { background:color-mix(in srgb, var(--accent) 55%, var(--tab)); cursor:default; }
  #update-pill .upd-x { margin-left:4px; opacity:.7; font-size:13px; line-height:1; }
  #update-pill .upd-x:hover { opacity:1; }
  #star.on { color:#f7c948; }
  #shield { font-size:14px; }
  #shield.off { opacity:.4; }
  #shield .n { position:absolute; right:0; top:-2px; font-size:9px; background:var(--accent); color:var(--onaccent);
    border-radius:8px; padding:0 4px; }
  #priv { display:none; font-size:12px; color:#b57bee; padding:0 4px; }
  body.is-private #priv { display:block; }
  #dl-pill { display:none; align-items:center; padding:1px 8px; height:20px; border-radius:11px; background:var(--tab); border:1px solid transparent; font-size:11px; cursor:pointer; white-space:nowrap; overflow:hidden; max-width:220px; text-overflow:ellipsis; color:var(--muted); }
  #dl-pill.active { color:var(--accent); border-color:var(--accent); }
  #bar button.ic#dlbtn { display:none; }
  #bar button.ic#dlbtn.show { display:grid; }
  #dlbtn { position:relative; }
  #dlbtn .ring { position:absolute; inset:0; margin:auto; width:26px; height:26px; transform:rotate(-90deg); pointer-events:none; display:none; }
  #dlbtn.active .ring { display:block; }
  #dlbtn .ring circle { fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; stroke-dasharray:0 100; transition:stroke-dasharray .3s ease; }
  #dlbtn .ring.indet { animation:dlspin 1s linear infinite; }
  @keyframes dlspin { to { transform:rotate(270deg); } }
  #dlbtn.active { color:var(--accent); }
  #dlbtn.done { color:#4cc38a; }
  #dlbtn .n { position:absolute; right:-3px; top:-3px; font-size:9px; border-radius:8px; padding:0 3px; min-width:14px; text-align:center; line-height:14px; }
  #dlbtn.active .n { background:var(--accent); color:var(--onaccent); }
  #dlbtn .n { display:none; }
  #dlbtn.show .n { display:block; background:var(--tab); color:var(--fg); }
  #dlbtn.active .n { background:var(--accent); color:var(--onaccent); }
  #dlbtn.done .n { background:#4cc38a; color:#fff; }
  #dlbtn.dl-pop { animation: dl-btn-pop 0.35s cubic-bezier(.4,0,.2,1); }
  @keyframes dl-btn-pop {
    0%  { transform: scale(1); }
    40% { transform: scale(1.8); }
    70% { transform: scale(0.88); }
    100%{ transform: scale(1); }
  }
  .dl-whoosh-trail { position:fixed; left:0; height:6px; border-radius:3px; pointer-events:none; z-index:99998;
    background:linear-gradient(90deg, transparent, var(--accent)); box-shadow:0 0 14px 3px var(--accent); }
  .dl-chip { position:fixed; z-index:99999; pointer-events:none; padding:5px 10px; border-radius:8px; font-size:12px; white-space:nowrap;
    background:var(--accent); color:var(--onaccent, #fff); box-shadow:0 4px 14px rgba(0,0,0,.35); transition:opacity .35s ease; }
  .dl-whoosh-orb {
    position: fixed; pointer-events: none; z-index: 99999;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--tab); border: 1.5px solid var(--accent);
    color: var(--accent); display: grid; place-items: center;
    will-change: left, top, transform, opacity;
  }

</style>
</head>
<body>
  <div id="tabs">
    <button id="tabs-menu-btn" title="Menu"><img src="my://assets/logo.png" alt="☰" id="logo-img"></button>
    <div id="tabs-wrap"></div>
  </div>
  <div id="winbar">
    <button id="tl" class="ic" title="All tabs and recently closed"></button>
    <span id="wc">
      <button id="wmin" class="ic" title="Minimize"></button>
      <button id="wmax" class="ic" title="Maximize"></button>
      <button id="wclose" class="ic" title="Close"></button>
    </span>
  </div>
  <div id="status">
    <button id="st-cog" title="Settings">⚙</button>
    <button id="st-lock" title="Lock profile (Ctrl+Shift+L)"></button>
    <span class="dot" id="st-dot" style="display:none"></span>
    <span class="grow" id="st-text"></span>
    <button id="st-home" style="display:none"></button>
    <span id="st-blocked"></span>
    <button id="dl-pill" title="Downloads (right-click for options)"></button>
    <span id="st-zoom-wrap">
      <input id="st-zoom-range" type="range" min="30" max="300" step="10" title="Zoom">
      <span id="st-zoom-pct" title="Reset zoom to 100%"></span>
    </span>
    <span id="st-tabs"></span>
    <span id="st-time"></span>
    <span id="update-pill" title="Click to install update">
      <span id="upd-text">⬆ Update available</span>
      <span class="upd-x" id="update-dismiss" title="Dismiss">×</span>
    </span>
  </div>
  <div id="bar">
    <button id="back" class="nav" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg></button>
    <button id="fwd" class="nav" title="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></button>
    <button id="reload" class="nav" title="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 0-2.4 5.7"/><path d="M20 4v8h-8"/></svg></button>
    <span id="priv">Private</span>
    <div id="urlwrap">
      <div id="urlprog"></div>
      <button id="eng" title="Search engine (click to change)"><img id="engimg" alt=""><span id="engl"></span></button>
      <button id="sec" class="internal" title="Connection and site information"><span id="secicon" class="ic"></span><span class="lbl" id="seclbl"></span></button>
      <input id="url" placeholder="Search or enter address" spellcheck="false">
      <button id="key" class="ic" title="Saved logins for this site"><span id="keyic"></span><span class="n" id="keyn"></span></button>
    </div>
    <button id="shield" class="ic" title="Tracker blocking for this site"><span id="shieldic"></span><span class="n" id="shieldn"></span></button>
    <button id="dlbtn" class="ic" title="Downloads"><svg class="ring" id="dlbtn-ring" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" pathLength="100"/></svg><span id="dlbtn-ic"></span><span class="n" id="dlbtn-n"></span></button>
    <span id="exts"></span>
    <button id="star" class="ic" title="Bookmark (Ctrl+D)"></button>
    <button id="profile" title="Profiles"><span id="pchip"></span></button>
    <div id="dl-bar"></div>
  </div>
  <div id="default-bar">
    <span class="df-msg">mbrowser is not your default browser.</span>
    <button id="df-set">Set as default</button>
    <button id="df-never">Don’t ask again</button>
    <button id="df-close" title="Dismiss">✕</button>
  </div>
  <div id="translate-bar">
    <span class="tl-msg" id="tl-msg">This page is in a different language</span>
    <button id="tl-btn">Translate</button>
    <button id="tl-close" title="Dismiss">✕</button>
  </div>
  <div id="newtab-ctx">
    <div class="nctx-item" id="nctx-new">New tab</div>
    <div class="nctx-item" id="nctx-private">New private tab</div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const svg = (inner) => '<svg viewBox="0 0 24 24">' + inner + '</svg>';
  const ICON = {
    star: svg('<path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>'),
    shield: svg('<path d="M12 3l7.5 3v5.2c0 4.3-3.1 7.8-7.5 9.8-4.4-2-7.5-5.5-7.5-9.8V6z"/><path d="M8.8 12l2.2 2.2 4.2-4.4"/>'),
    lock: svg('<rect x="5" y="11" width="14" height="9.5" rx="2.2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
    warn: svg('<path d="M12 4.2l9 15.6H3z"/><path d="M12 10v4.2M12 17.4v.01"/>'),
    info: svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5.2M12 7.8v.01"/>'),
    chevron: svg('<path d="M6 9.5l6 6 6-6"/>'),
    min: svg('<path d="M6 12h12"/>'),
    max: svg('<rect x="6" y="6" width="12" height="12" rx="1.6"/>'),

      const strip = $('tabs-wrap');
      const prevActive = lastActiveId;
      lastActiveId = s.activeId;
      strip.textContent = '';
      for (const t of s.tabs) strip.appendChild(tabEl(t, s.activeId));
      const plus = document.createElement('button');
      plus.id = 'newtab';
      plus.textContent = s.tabBar === 'left' ? '+  New tab' : '+';
      plus.onclick = () => api.newTab();
      plus.oncontextmenu = (e) => { e.preventDefault(); api.newtabMenu(); };
      strip.appendChild(plus);
      strip.classList.toggle('compact', s.tabs.length >= 12);
      // scroll active tab into view when it changes
      if (s.activeId !== prevActive) {
        requestAnimationFrame(() => {
          const active = strip.querySelector('.tab.active');
          if (!active) return;
          const PAD = 80;
          const r = active.getBoundingClientRect(), sr = strip.getBoundingClientRect();
          if (r.right > sr.right - PAD) strip.scrollBy({ left: r.right - sr.right + PAD, behavior: 'smooth' });
          else if (r.left < sr.left + PAD) strip.scrollBy({ left: r.left - sr.left - PAD, behavior: 'smooth' });
        });
      }
    }
  });
</script>
</body>
</html>
