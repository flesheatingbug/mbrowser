<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
  #h { position:absolute; inset:0; cursor:col-resize; display:flex; justify-content:center; }
  body.split #h::after { width:4px; border-radius:2px; background:rgba(127,127,127,.5); }
  body.split #h:hover::after, body.split #h.hot::after, body.split #h.drag::after { background:var(--accent, #5b8cff); }
  #h::after { content:""; width:2px; height:100%; background:transparent; }
  #h:hover::after, #h.drag::after { background:var(--accent, #5b8cff); }
  body.split #h.drag::after { width:6px; opacity:.65; box-shadow:0 0 8px var(--accent, #5b8cff); }
</style>
</head>
<body>
<div id="h"></div>
<script>
  const h = document.getElementById('h');
  if (new URLSearchParams(location.search).get('split') !== null) document.body.classList.add('split');
  let startX = 0;
  const split = new URLSearchParams(location.search).get('split');
  const send = (phase, dx) => split === null ? api.panelResize(phase, dx) : api.splitResize(Number(split), phase, dx);
  api.onState((s) => { document.documentElement.style.setProperty('--accent', s.theme.accent); });
  // :hover can go stale when this view is moved under a still mouse, so track it by hand as well
  document.addEventListener('pointermove', () => h.classList.add('hot'), true);
  document.addEventListener('pointerleave', () => { if (!h.classList.contains('drag')) h.classList.remove('hot'); }, true);
  document.documentElement.addEventListener('mouseleave', () => { if (!h.classList.contains('drag')) h.classList.remove('hot'); });
  h.addEventListener('pointerdown', (e) => {
    startX = e.screenX;
    h.setPointerCapture(e.pointerId);
    h.classList.add('drag');
    send('start', 0);
  });
  h.addEventListener('pointermove', (e) => {
    if (h.hasPointerCapture(e.pointerId)) send('move', e.screenX - startX);
  });
  const end = (e) => {
    if (!h.hasPointerCapture(e.pointerId)) return;
    h.releasePointerCapture(e.pointerId);
    h.classList.remove('drag'); h.classList.remove('hot');
    send('end', e.screenX - startX);
  };
  h.addEventListener('pointerup', end);
  h.addEventListener('pointercancel', end);
</script>
</body>
</html>
