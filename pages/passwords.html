<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Passwords</title>
<link rel="stylesheet" href="my://assets/theme.css">
<link rel="stylesheet" href="my://assets/common.css">
<style>
  html, body { height:100%; }
  .app { display:flex; flex-direction:column; height:100vh; }
  .sectabs { display:flex; gap:0; border-bottom:1px solid var(--line); padding:0 16px; }
  .sectabs button { background:none; border:0; border-bottom:2px solid transparent; padding:10px 16px; font:inherit; color:var(--muted); cursor:pointer; font-size:14px; }
  .sectabs button.on { color:var(--fg); border-bottom-color:var(--accent); }
  .sectabs button:hover:not(.on) { color:var(--fg); }
  .section { display:none; flex:1; overflow:hidden; }
  .section.on { display:flex; }
  .pw-layout { height:100%; width:100%; }
  .section.on.pw-layout { display:flex; }
  aside { width:260px; flex:none; border-right:1px solid var(--line); padding:18px 10px; overflow-y:auto; }
  aside h1 { font-size:18px; margin:0 8px 14px; }
  main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .gate { max-width:520px; margin:8vh auto; padding:0 20px; width:100%; }
  .card { background:var(--tab); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card input { width:100%; margin:6px 0; }
  .err { color:#ff6b6b; min-height:18px; font-size:13px; }
  .top { display:flex; gap:8px; padding:16px 20px 8px; align-items:center; flex-wrap:wrap; }
  .top input[type=search] { flex:1; min-width:180px; }
  #syncbox { padding:0 20px 6px; font-size:12px; color:var(--muted); }
  #msg { padding:0 20px 6px; font-size:13px; color:var(--muted); min-height:18px; }
  .bulk { display:none; padding:8px 20px; background:var(--tab); border-top:1px solid var(--line); border-bottom:1px solid var(--line); gap:8px; align-items:center; }
  .bulk.on { display:flex; }
  .list { flex:1; overflow-y:auto; padding:4px 12px 40px; }
  .node { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; cursor:pointer; user-select:none; }
  .node:hover { background:var(--tab); }
  .node.on { background:var(--accent); color:var(--onaccent); }
  .node.drop { outline:2px dashed var(--accent); }
  .node .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node .ct { font-size:11px; opacity:.7; }
  .node .fa { display:none; gap:2px; } .node:hover .fa { display:flex; }
  .node .fa span { padding:0 4px; opacity:.8; } .node .fa span:hover { opacity:1; }
  .node svg { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .e { display:flex; align-items:center; gap:12px; padding:9px 8px; border-bottom:1px solid var(--line); border-radius:8px; }
  .e:hover { background:var(--tab); }
  .e .av { width:34px; height:34px; border-radius:10px; background:var(--line); display:grid; place-items:center; font-weight:700; color:var(--muted); flex:none; }
  .e .t { flex:1; min-width:120px; }
  .e .t b { display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg); }
  .e .t small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .e .pw { font-family:ui-monospace, monospace; color:var(--muted); overflow:hidden; }
  .e .acts { display:none; gap:4px; align-items:center; flex:none; }
  .e:hover .acts, .e:focus-within .acts { display:flex; }
  .e .acts button, .e .acts a { padding:3px 10px; font-size:12px; }
  .e .tag { font-size:11px; border:1px solid var(--line); border-radius:9px; padding:0 8px; color:var(--muted); flex:none; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:grid; place-items:center; z-index:10; overflow:auto; }
  .modal form { background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:20px; width:min(500px, 94vw); }
  .modal h3 { margin:0 0 6px; }
  .modal label { display:block; margin:10px 0 3px; color:var(--muted); font-size:13px; }
  .modal input[type=text], .modal input[type=password], .modal textarea { width:100%; }
  .modal textarea { min-height:70px; resize:vertical; }
  .modal .r { display:flex; gap:8px; margin-top:16px; }
  .modal .inl { display:flex; gap:6px; }
  .note { font-size:12px; color:var(--muted); line-height:1.5; max-width:720px; padding:0 20px 20px; }
  .empty { color:var(--muted); padding:30px 10px; text-align:center; }
  .card-grid { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; max-width:700px; }
  .citem { background:var(--tab); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:14px; }
  .citem .lic { font-size:28px; }
  .citem .lt { flex:1; min-width:0; }
  .citem .lt b { display:block; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .citem .lt small { color:var(--muted); font-size:12px; }
  .citem button { padding:3px 10px; font-size:12px; }
  .modal-card { max-width:420px; }
  .modal-card label { display:block; margin:10px 0 3px; color:var(--muted); font-size:13px; }
  .modal-card input { width:100%; }
  .fi2 { display:flex; gap:10px; }
  .fi2 > div { flex:1; }
  .ctx { position:fixed; z-index:100; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:4px; min-width:150px; box-shadow:0 4px 20px rgba(0,0,0,.18); }
  .ctx-item { padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; white-space:nowrap; }
  .ctx-item:hover { background:var(--accent); color:var(--onaccent); }
  .ctx-item:hover.ctx-danger { background:#ef4444; color:#fff; }
  .ctx-item.ctx-danger { color:#ef4444; }
  .ctx-sep { height:1px; background:var(--line); margin:4px 2px; }
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
<div id="ctx" class="ctx" style="display:none"></div>
  <div class="sectabs">
    <button id="tab-pw" class="on" onclick="switchTab('pw')">🔑 Passwords</button>
    <button id="tab-cards" onclick="switchTab('cards')">💳 Cards</button>
    <button id="tab-addrs" onclick="switchTab('addrs')">🏠 Addresses</button>
  </div>
  <div id="sec-pw" class="section on pw-layout">
    <aside>
      <h1>Passwords</h1>
      <div id="tree"></div>
      <button id="newfolder" style="margin:12px 8px 0">+ New folder</button>
    </aside>
    <main>
      <div class="top">
        <input id="q" type="search" placeholder="Search by name, website or username">
        <button id="add">+ Add</button>
        <button id="bsall">Select all</button>
        <button id="imp">Import…</button>
        <button id="exp">Export CSV…</button>
        <button id="sec" title="Master password, remember on this computer">🔒 Security</button>
        <button id="phonekey" title="Copy the vault key (only for a vault without a master password)">📱 Device key</button>
        <input id="file" type="file" accept=".csv,.json,text/csv,application/json" style="display:none">
      </div>
      <div id="syncbox"></div>
      <div id="msg"></div>
      <div class="bulk" id="bulk"><span id="bulkn"></span><button id="bmove">Move to folder…</button><button id="bdel" class="danger">Delete</button><button id="bclear">Clear selection</button></div>
      <div class="list" id="list"></div>
      <p class="note">Passwords are encrypted using your device's secure keychain (AES-256). If sync is on, only the encrypted vault is uploaded to your own server — the server cannot read it. Exported CSV files are <b>not</b> encrypted: delete them when done. <a href="my://import">More import options</a></p>
    </main>
  </div>
  <div id="sec-cards" class="section">
    <div class="card-grid">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <h2 style="margin:0;flex:1">Payment Cards</h2>
        <button id="add-card">+ Add Card</button>
      </div>
      <div id="cards-list"></div>
    </div>
  </div>
  <div id="sec-addrs" class="section">
    <div class="card-grid">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <h2 style="margin:0;flex:1">Saved Addresses</h2>
        <button id="add-addr">+ Add Address</button>
      </div>
      <div id="addrs-list"></div>
    </div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  document.addEventListener('DOMContentLoaded', () => {
    const b = document.getElementById('phonekey');
    if (b) b.onclick = async () => {
      if (!confirm('This copies the key that unlocks this vault. Paste it once into the other device, then clear your clipboard. Anyone who has the key and your server data can read your passwords.')) return;
      const r = await browser.vaultExportKey();
      if (r.error) { alert(r.error); return; }
      try { await navigator.clipboard.writeText(r.key); alert('Key copied. Paste it into the Android app.'); }
      catch { prompt('Copy this key:', r.key); }
    };
  });
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const FOLDER = '<svg viewBox="0 0 24 24"><path d="M3.5 7a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>';
  const ALL = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9.5" rx="2.2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

  let entries = [], folders = [];
  let sel = null;               // null = all, '' = no folder, otherwise a folder name
  let picked = new Set();
  let drag = null;
  const flash = (t) => { $('msg').textContent = t; };

  const ctxEl = $('ctx');
  document.addEventListener('click', () => { ctxEl.style.display = 'none'; });
  function showCtx(x, y, items) {
    ctxEl.textContent = '';
    for (const it of items) {
      if (it === '-') { ctxEl.append(el('div', 'ctx-sep')); continue; }
      const row = el('div', 'ctx-item' + (it.danger ? ' ctx-danger' : ''), it.label);
      row.onmousedown = (e) => { e.stopPropagation(); ctxEl.style.display = 'none'; it.fn(); };
      ctxEl.append(row);
    }
    ctxEl.style.display = 'block';
    ctxEl.style.left = Math.min(x, innerWidth - ctxEl.offsetWidth - 8) + 'px';
    ctxEl.style.top = Math.min(y, innerHeight - ctxEl.offsetHeight - 8) + 'px';
  }

  // ---- small form dialog; fields: [{ key, label, type, value, list, area }] ----
  function ask(title, fields, okText, validate, extra) {
    return new Promise((resolve) => {
      const m = el('div', 'modal'); const f = el('form'); m.append(f);
      f.append(el('h3', null, title));
      const ins = {};
      for (const fd of fields) {
        f.append(el('label', null, fd.label));
        const i = fd.area ? el('textarea') : el('input');
        if (!fd.area) i.type = fd.type || 'text';
        i.value = fd.value || ''; i.autocomplete = 'off'; ins[fd.key] = i;
        if (fd.list) { const dl = el('datalist'); dl.id = 'dl-' + fd.key; fd.list.forEach((x) => { const o = el('option'); o.value = x; dl.append(o); }); f.append(dl); i.setAttribute('list', dl.id); }
        if (fd.key === 'password') {
          const box = el('div', 'inl'); box.append(i);
          const sh = el('button', null, 'Show'); sh.type = 'button'; sh.onclick = () => { const on = i.type === 'password'; i.type = on ? 'text' : 'password'; sh.textContent = on ? 'Hide' : 'Show'; };
          const gen = el('button', null, 'Generate'); gen.type = 'button';
          gen.onclick = () => { const set = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*-_=+'; const a = new Uint32Array(20); crypto.getRandomValues(a); i.value = Array.from(a, (n) => set[n % set.length]).join(''); i.type = 'text'; sh.textContent = 'Hide'; };
          box.append(sh, gen); f.append(box);
        } else f.append(i);
      }
      const err = el('div', 'err'); f.append(err);
      const row = el('div', 'r'); const ok = el('button', null, okText || 'OK'); const no = el('button', null, 'Cancel'); no.type = 'button'; row.append(ok, no); f.append(row);
      document.body.append(m); const first = f.querySelector('input'); if (first) first.focus();
      no.onclick = () => { m.remove(); resolve(null); };
      f.onsubmit = async (e) => {
        e.preventDefault();
        const v = {}; for (const k in ins) v[k] = ins[k].value;
        const msg = validate ? await validate(v) : null;
        if (msg) { err.textContent = msg; return; }
        m.remove(); resolve(v);
      };
    });
  }

  // ---- sync status ----
  async function showSync() {
    const s = await browser.vaultSyncStatus();
    const box = $('syncbox'); box.textContent = '';
    if (!s.configured) { box.textContent = 'Sync: not set up (Settings → Sync).'; return; }
    if (!s.enabled) { box.textContent = 'Sync: off for passwords (Settings → Passwords).'; return; }
    box.append(document.createTextNode('Sync: ' + s.message + ' '));
    if (s.state === 'different-vault' || s.state === 'different-key') {
      const a = el('button', null, 'Use the server’s vault');
      a.onclick = async () => { if (confirm('Switch to the vault stored on your server? Your current local vault is kept as vault.json.local-backup.')) { await browser.vaultSyncResolve('server'); init(); } };
      const b = el('button', 'danger', 'Replace the server’s vault with this one');
      b.onclick = async () => { if (confirm('Overwrite the vault on your server with this computer’s vault?')) { await browser.vaultSyncResolve('local'); init(); } };
      box.append(a, document.createTextNode(' '), b);
    }
  }

  // ---- create / unlock ----
  const field = (f, label, type) => { f.append(el('label', null, label)); const i = el('input'); i.type = type || 'password'; i.autocomplete = 'off'; f.append(i); return i; };
  const check = (f, text, on) => {
    const l = el('label'); l.style.cssText = 'display:flex;gap:8px;align-items:center;color:var(--fg)';
    const c = el('input'); c.type = 'checkbox'; c.checked = on; c.style.width = 'auto';
    l.append(c, document.createTextNode(text)); f.append(l); return c;
  };
  const para = (f, text, warn) => { const p = el('p', null, text); p.style.cssText = 'font-size:13px;line-height:1.5;margin:8px 0;color:' + (warn ? 'var(--fg)' : 'var(--muted)'); f.append(p); return p; };

  // a dialog that stays until the vault is open: set it up, join the server's, unlock, or paste the key
  function showGate(state, st, remote) {
    document.querySelectorAll('.gatem').forEach((x) => x.remove());
    const m = el('div', 'modal gatem'); const f = el('form'); m.append(f);
    const err = el('div', 'err');
    const row = el('div', 'r'); const ok = el('button', null, 'Continue'); row.append(ok);
    let submit;
    if (state === 'locked') {
      f.append(el('h3', null, 'Unlock your passwords'));
      const pw = field(f, 'Master password');
      const rem = check(f, 'Remember it on this computer (only type it once)', st.remember);
      ok.textContent = 'Unlock';
      submit = async () => { await browser.vaultSetRemember(rem.checked); return browser.vaultUnlock(pw.value); };
    } else if (state === 'needkey') {
      f.append(el('h3', null, 'This computer does not have the vault key'));
      para(f, 'This vault has no master password. It can only be opened with the key from the computer that made it (open Passwords there and press “Phone / device key”), or switch that computer to a master password so that every device can open it.');
      const k = field(f, 'Vault key', 'text');
      ok.textContent = 'Use key';
      submit = () => browser.vaultImportKey(k.value);
    } else if (state === 'join') {
      f.append(el('h3', null, 'Your server already has a password vault'));
      let pw, k, rem;
      if (remote.device) {
        para(f, 'It is locked with a key from another computer instead of a master password. Paste that key (press “Phone / device key” on that computer), or set a master password there to make it work on every device.');
        k = field(f, 'Vault key', 'text');
      } else {
        para(f, 'Enter its master password to use the same passwords here.');
        pw = field(f, 'Master password');
        rem = check(f, 'Remember it on this computer (only type it once)', st.remember);
      }
      ok.textContent = 'Open vault';
      submit = () => browser.vaultJoin({ master: pw && pw.value, key: k && k.value, remember: rem ? rem.checked : undefined });
    } else { // set up
      f.append(el('h3', null, 'Set up your password vault'));
      let mode = st.syncReady ? 'master' : 'device';
      const mk = (val, title, desc) => {
        const l = el('label'); l.style.cssText = 'display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer';
        const r = el('input'); r.type = 'radio'; r.name = 'mode'; r.checked = mode === val; r.style.cssText = 'width:auto;margin-top:3px';
        r.onchange = () => { mode = val; sync(); };
        const t = el('div'); const b = el('b', null, title); b.style.color = 'var(--fg)'; t.append(b, el('br'), el('span', null, desc)); t.lastChild.style.cssText = 'font-size:12px;color:var(--muted)';
        l.append(r, t); f.append(l);
      };
      mk('master', 'Master password' + (st.syncReady ? ' (recommended)' : ''), 'One password that opens your vault on every device. Needed to sync passwords between computers and your phone.');
      mk('device', 'No password (this computer only)', 'Opens automatically, protected by your OS account. Other devices cannot read the vault.');
      const box = el('div'); f.append(box);
      const warn = para(f, '', true);
      const sync = () => {
        box.textContent = '';
        if (mode === 'master') {
          box._pw = field(box, 'Master password'); box._cf = field(box, 'Repeat the master password');
          box._rem = check(box, 'Remember it on this computer (only type it once)', st.remember);
          warn.textContent = 'Write it down somewhere safe: it cannot be recovered. A master password is essential if you want your passwords on more than one device.';
        } else {
          warn.textContent = st.syncReady
            ? 'You are connected to a server, but without a master password your other devices will not be able to read synced passwords. You can add one later from Security.'
            : 'Passwords stay on this computer. To sync them to other devices later, add a master password from Security.';
        }
      };
      sync();
      ok.textContent = 'Create vault';
      submit = () => mode === 'device' ? browser.vaultSetup({ mode: 'device' })
        : browser.vaultSetup({ mode: 'master', master: box._pw.value, confirm: box._cf.value, remember: box._rem.checked });
    }
    f.append(err, row);
    f.onsubmit = async (e) => {
      e.preventDefault(); ok.disabled = true; err.textContent = '';
      const r = await submit();
      ok.disabled = false;
      if (r && r.error) { err.textContent = r.error; return; }
      m.remove(); init();
    };
    document.body.append(m);
    const first = f.querySelector('input[type=password], input[type=text]'); if (first) first.focus();
  }

  async function init() {
    showSync();
    const o = await browser.vaultOpen();
    const st = await browser.vaultStatus();
    $('app').style.display = 'flex';
    $('phonekey').style.display = st.mode === 'device' ? '' : 'none';
    if (st.unlocked) { await refresh(); return; }
    entries = []; folders = []; render();
    if (o.state === 'none') {
      let remote = null;
      if (st.syncReady) { const r = await browser.vaultRemoteInfo(); if (r && r.exists) remote = r; }
      showGate(remote ? 'join' : 'setup', st, remote);
    } else showGate(o.state, st);
  }

  // ---- security: master password / device key, remember on this computer ----
  async function openSecurity() {
    const st = await browser.vaultStatus();
    const m = el('div', 'modal'); const f = el('form'); m.append(f);
    f.append(el('h3', null, 'Vault security'));
    const close = () => { m.remove(); init(); };
    const btn = (text, fn, danger) => { const b = el('button', danger ? 'danger' : null, text); b.type = 'button'; b.style.margin = '4px 6px 4px 0'; b.onclick = fn; f.append(b); return b; };
    if (st.mode === 'master') {
      para(f, 'Protected by your master password. It opens the vault on every device you sign in to.');
      const rem = check(f, 'Only type the master password once on this computer', st.remember);
      rem.onchange = async () => { await browser.vaultSetRemember(rem.checked); };
      para(f, 'Switch this off to be asked again each time the browser starts (the vault also locks itself after a while).');
      btn('Change master password…', async () => {
        const r = await ask('Change master password', [{ key: 'o', label: 'Current master password', type: 'password' }, { key: 'n', label: 'New master password', type: 'password' }, { key: 'c', label: 'Repeat the new one', type: 'password' }], 'Change', async (v) => {
          if (!v.n) return 'Enter a new password.';
          if (v.n !== v.c) return 'The two new passwords do not match.';
          const x = await browser.vaultChangeMaster(v.o, v.n); return x.error || null;
        });
        if (r) flash('Master password changed. Other devices need the new one.');
      });
      btn('Lock now', async () => { await browser.vaultLock(); m.remove(); init(); });
      btn('Remove the master password…', async () => {
        if (!confirm('Switch to a key kept only on this computer (no password)?' + (st.syncReady ? '\n\nYour other devices will no longer be able to read your synced passwords.' : ''))) return;
        const r = await browser.vaultSetMode({ mode: 'device' }); if (r.error) alert(r.error); else { flash('The vault now opens automatically on this computer only.'); close(); }
      }, true);
    } else {
      para(f, 'No master password: the vault opens automatically on this computer and cannot be read on other devices.', true);
      if (st.syncReady) para(f, 'You are connected to a sync server. A master password is essential to read your passwords on other devices.', true);
      btn('Set a master password…', async () => {
        const r = await ask('Set a master password', [{ key: 'n', label: 'Master password', type: 'password' }, { key: 'c', label: 'Repeat it', type: 'password' }], 'Set', async (v) => {
          const x = await browser.vaultSetMode({ mode: 'master', master: v.n, confirm: v.c }); return x.error || null;
        });
        if (r) { flash('Master password set. Use it on your other devices.'); close(); }
      });
    }
    const row = el('div', 'r'); const done = el('button', null, 'Close'); done.type = 'button'; done.onclick = close; row.append(done); f.append(row);
    document.body.append(m);
  }

  async function refresh() {
    const list = await browser.vaultList();
    if (!list) { init(); return; }
    entries = list;
    folders = await browser.vaultFolders();
    if (sel && !folders.some((f) => f.name === sel)) sel = null;
    render();
  }

  // ---- folders (left) ----
  function node(label, icon, value, count, deletable) {
    const row = el('div', 'node' + (sel === value ? ' on' : ''));
    const ic = el('span'); ic.innerHTML = icon;
    row.append(ic, el('span', 'nm', label), el('span', 'ct', String(count)));
    if (deletable) {
      const fa = el('span', 'fa');
      const rn = el('span', null, '✎'); rn.title = 'Rename';
      rn.onclick = async (e) => { e.stopPropagation(); const r = await ask('Rename folder', [{ key: 'n', label: 'Name', value: value }], 'Rename', async (v) => { const x = await browser.vaultFolderRename(value, v.n); if (!x.error && sel === value) sel = v.n.trim(); return x.error || null; }); if (r) refresh(); };
      const dl = el('span', null, '✕'); dl.title = 'Delete folder (its logins are kept)';
      dl.onclick = async (e) => { e.stopPropagation(); if (confirm('Delete the folder “' + value + '”? The ' + count + ' login(s) in it are kept, without a folder.')) { await browser.vaultFolderRemove(value); if (sel === value) sel = null; refresh(); } };
      fa.append(rn, dl); row.append(fa);
    }
    row.onclick = () => { sel = value; picked.clear(); render(); };
    if (value !== null) {
      row.ondragover = (e) => { if (drag) { e.preventDefault(); row.classList.add('drop'); } };
      row.ondragleave = () => row.classList.remove('drop');
      row.ondrop = async (e) => { e.preventDefault(); row.classList.remove('drop'); if (!drag) return; await browser.vaultMove(drag, value); drag = null; picked.clear(); refresh(); };
    }
    return row;
  }

  function visible() {
    const terms = $('q').value.toLowerCase().split(/\s+/).filter(Boolean);
    return entries.filter((e) => {
      if (terms.length) return terms.every((t) => (e.name + ' ' + e.origin + ' ' + e.username + ' ' + e.folder).toLowerCase().includes(t));
      return sel === null ? true : e.folder === sel;
    }).sort((a, b) => a.name.localeCompare(b.name));
  }

  function render() {
    const tree = $('tree'); tree.textContent = '';
    tree.append(node('All items', ALL, null, entries.length));
    tree.append(node('No folder', FOLDER, '', entries.filter((e) => !e.folder).length));
    folders.forEach((f) => tree.append(node(f.name, FOLDER, f.name, f.count, true)));

    const list = $('list'); list.textContent = '';
    const shown = visible();
    for (const e of shown) {
      const row = el('div', 'e'); row.draggable = true;
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = picked.has(e.id);
      cb.onchange = () => { if (cb.checked) picked.add(e.id); else picked.delete(e.id); bulk(); };
      const av = el('div', 'av', (e.name || '?').charAt(0).toUpperCase());
      const t = el('div', 't'); t.append(el('b', null, e.name || e.origin.replace(/^https?:\/\/(www\.)?/, '')), el('small', 'muted', (e.username || '(no username)') + '  ·  ' + e.origin.replace(/^https?:\/\//, '')));
      row.append(cb, av, t);
      if (e.folder && (sel === null || $('q').value.trim())) row.append(el('span', 'tag', e.folder));
      const acts = el('div', 'acts');
      const pw = el('span', 'pw', '••••••••••');
      const show = el('button', null, 'Show');
      show.onclick = async () => {
        if (show.textContent === 'Hide') { pw.textContent = '••••••••••'; show.textContent = 'Show'; return; }
        pw.textContent = await browser.vaultReveal(e.id); show.textContent = 'Hide';
        setTimeout(() => { pw.textContent = '••••••••••'; show.textContent = 'Show'; }, 15000);
      };
      const copy = el('button', null, 'Copy');
      copy.onclick = async () => { await browser.vaultCopy(e.id); flash('Password copied. It is cleared from the clipboard after 30 seconds.'); };
      const open = el('a', null, 'Open'); open.href = e.origin; open.style.fontSize = '12px';
      const ed = el('button', null, 'Edit'); ed.onclick = async () => editEntry(e, await browser.vaultReveal(e.id));
      const del = el('button', 'danger', 'Delete');
      del.onclick = async () => { if (confirm('Delete “' + e.name + '”?')) { await browser.vaultDelete(e.id); picked.delete(e.id); refresh(); } };
      acts.append(pw, show, copy, open, ed, del);
      row.append(acts);
      row.ondragstart = (ev) => { drag = picked.has(e.id) ? [...picked] : [e.id]; ev.dataTransfer.setData('text/plain', e.name); ev.dataTransfer.effectAllowed = 'move'; };
      row.ondragend = () => { drag = null; };
      row.oncontextmenu = (ev) => { ev.preventDefault(); showCtx(ev.clientX, ev.clientY, [
        { label: 'Edit', fn: async () => editEntry(e, await browser.vaultReveal(e.id)) },
        '-',
        { label: 'Delete', danger: true, fn: async () => { if (confirm('Delete "' + e.name + '"?')) { await browser.vaultDelete(e.id); picked.delete(e.id); refresh(); } } },
      ]); };
      list.append(row);
    }
    if (!shown.length) list.append(el('div', 'empty', entries.length ? 'No logins here.' : 'No saved passwords yet. They are offered when you sign in to a site, or use Import.'));
    bulk();
  }

  function bulk() { $('bulk').classList.toggle('on', picked.size > 0); $('bulkn').textContent = picked.size + ' selected'; }

  async function editEntry(e, pw) {
    const r = await ask(e ? 'Edit login' : 'Add login', [
      { key: 'name', label: 'Name (to recognise it)', value: e ? e.name : '' },
      { key: 'url', label: 'Website', value: e ? e.origin : '' },
      { key: 'username', label: 'Username', value: e ? e.username : '' },
      { key: 'password', label: 'Password', type: 'password', value: pw || '' },
      { key: 'folder', label: 'Folder (type a new name to create one)', value: e ? e.folder : (sel || ''), list: folders.map((f) => f.name) },
      { key: 'note', label: 'Notes', value: e ? e.note : '', area: true },
    ], 'Save', async (v) => {
      let url = v.url.trim(); if (url && !/^https?:\/\//i.test(url)) url = (/^(\d{1,3}\.){3}\d{1,3}(:\d+)?$|^localhost(:\d+)?$/i.test(url) ? 'http://' : 'https://') + url;
      const x = await browser.vaultSave({ id: e ? e.id : null, url, name: v.name, folder: v.folder, username: v.username, password: v.password, note: v.note });
      return x.error ? (x.error === 'bad address' ? 'Enter a website address.' : x.error === 'bad password' ? 'Enter a password.' : x.error) : null;
    });
    if (r) { flash('Saved.'); refresh(); }
  }

  $('sec').onclick = openSecurity;
  $('add').onclick = () => editEntry(null, '');
  $('newfolder').onclick = async () => { const r = await ask('New folder', [{ key: 'n', label: 'Name' }], 'Create', async (v) => { const x = await browser.vaultFolderAdd(v.n); return x.error || null; }); if (r) refresh(); };
  $('bsall').onclick = () => { const shown = entries.filter((e) => !e.type || e.type === 'password').filter((e) => !sel || e.folder === sel); shown.forEach((e) => picked.add(e.id)); bulk(); };
  $('bdel').onclick = async () => { if (!confirm('Delete ' + picked.size + ' login(s)?')) return; for (const id of picked) await browser.vaultDelete(id); picked.clear(); refresh(); };
  $('bclear').onclick = () => { picked.clear(); render(); };
  $('bmove').onclick = async () => { const r = await ask('Move ' + picked.size + ' login(s)', [{ key: 'folder', label: 'Folder (empty = no folder; a new name creates it)', list: folders.map((f) => f.name) }]); if (r) { await browser.vaultMove([...picked], r.folder); picked.clear(); refresh(); } };
  $('q').oninput = render;
  $('imp').onclick = () => $('file').click();
  $('file').onchange = async () => {
    const f = $('file').files[0]; $('file').value = '';
    if (!f) return;
    const r = await browser.vaultImportFile(await f.text());
    if (r.error) { flash(r.error); return; }
    flash('Imported from ' + r.format + ': ' + r.added + ' added, ' + r.updated + ' updated, ' + r.skipped + ' skipped. Delete the file now: it holds your passwords in plain text.');
    refresh();
  };
  $('exp').onclick = async () => {
    if (!confirm('The exported file is NOT encrypted and will contain all your passwords in plain text. Continue?')) return;
    const csv = await browser.vaultExport();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'mbrowser-passwords.csv';
    document.body.append(a); a.click(); a.remove();
    flash('Exported to your Downloads folder as mbrowser-passwords.csv. Delete it when you are done.');
  };
  // ---- section tabs ----
  let curTab = 'pw';
  function switchTab(t) {
    curTab = t;
    ['pw', 'cards', 'addrs'].forEach((x) => {
      $('tab-' + x).classList.toggle('on', x === t);
      $('sec-' + x).classList.toggle('on', x === t);
    });
    if (t === 'cards') loadCards();
    if (t === 'addrs') loadAddresses();
  }

  // ---- cards ----
  let cardData = [];
  async function loadCards() {
    cardData = await browser.vaultListCards() || [];
    renderCards();
  }
  function renderCards() {
    const list = $('cards-list');
    list.textContent = '';
    if (!cardData.length) { list.append(el('p', 'empty', 'No saved cards. Click + Add Card to add one.')); return; }
    for (const c of cardData) {
      const item = el('div', 'citem');
      const ic = el('span', 'lic'); ic.textContent = '💳';
      const lt = el('div', 'lt');
      const b = el('b'); b.textContent = c.name;
      const sm = el('small'); sm.textContent = c.lastFour ? '···· ···· ···· ' + c.lastFour + (c.expiry ? '  exp ' + c.expiry : '') : '';
      lt.append(b, sm);
      const eBtn = el('button'); eBtn.textContent = 'Edit';
      eBtn.onclick = () => editCard(c);
      const dBtn = el('button', 'danger'); dBtn.textContent = 'Delete';
      dBtn.onclick = async () => { if (!confirm('Delete card ' + c.name + '?')) return; await browser.vaultDeleteCard(c.id); loadCards(); };
      item.append(ic, lt, eBtn, dBtn);
      list.append(item);
    }
  }
  async function editCard(c) {
    const modal = el('div', 'modal');
    const form = el('form', 'modal-card');
    form.innerHTML = '<h3>' + (c ? 'Edit Card' : 'Add Card') + '</h3>'
      + '<label>Card nickname</label><input name="name" value="' + (c ? (c.name||'') : '') + '" placeholder="e.g. Visa Business">'
      + '<label>Cardholder name</label><input name="cardName" value="' + (c ? (c.cardName||'') : '') + '" placeholder="Name on card">'
      + '<label>Card number</label><input name="number" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456">'
      + '<div class="fi2"><div><label>Expiry (MM/YY)</label><input name="expiry" placeholder="MM/YY" maxlength="5" autocomplete="cc-exp"></div>'
      + '<div><label>CVV</label><input name="cvv" type="password" placeholder="123" maxlength="4" autocomplete="cc-csc"></div></div>'
      + '<div class="r"><button type="submit">Save</button><button type="button" id="mc">Cancel</button></div>'
      + '<p class="err" id="cerr"></p>';
    modal.append(form);
    document.body.append(modal);
    form.querySelector('[name=number]').value = '';
    form.querySelector('#mc').onclick = () => modal.remove();
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(form));
      const payload = { id: c ? c.id : null, name: v.name, cardName: v.cardName, number: v.number.replace(/\s/g,''), expiry: v.expiry, cvv: v.cvv };
      const r = await browser.vaultSaveCard(payload);
      if (r.error) { form.querySelector('#cerr').textContent = r.error; return; }
      modal.remove(); loadCards();
    };
  }
  $('add-card').onclick = () => editCard(null);

  // ---- addresses ----
  let addrData = [];
  async function loadAddresses() {
    addrData = await browser.vaultListAddresses() || [];
    renderAddresses();
  }
  function renderAddresses() {
    const list = $('addrs-list');
    list.textContent = '';
    if (!addrData.length) { list.append(el('p', 'empty', 'No saved addresses. Click + Add Address to add one.')); return; }
    for (const a of addrData) {
      const item = el('div', 'citem');
      const ic = el('span', 'lic'); ic.textContent = '🏠';
      const lt = el('div', 'lt');
      const b = el('b'); b.textContent = a.name;
      const sm = el('small'); sm.textContent = [a.fullName, a.city, a.country].filter(Boolean).join(', ');
      lt.append(b, sm);
      const eBtn = el('button'); eBtn.textContent = 'Edit';
      eBtn.onclick = () => editAddress(a);
      const dBtn = el('button', 'danger'); dBtn.textContent = 'Delete';
      dBtn.onclick = async () => { if (!confirm('Delete address ' + a.name + '?')) return; await browser.vaultDeleteAddress(a.id); loadAddresses(); };
      item.append(ic, lt, eBtn, dBtn);
      list.append(item);
    }
  }
  async function editAddress(a) {
    // Fetch full address data for editing
    let full = a ? await browser.vaultRevealAddress(a.id) : {};
    full = full || {};
    const modal = el('div', 'modal');
    const form = el('form');
    form.style.cssText = 'background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(500px,94vw)';
    const fv = (k) => full[k] || '';
    form.innerHTML = '<h3>' + (a ? 'Edit Address' : 'Add Address') + '</h3>'
      + '<label style="display:block;margin:8px 0 2px;color:var(--muted);font-size:13px">Nickname</label><input name="name" value="' + (a ? (a.name||'') : '') + '" placeholder="e.g. Home">'
      + '<label style="display:block;margin:8px 0 2px;color:var(--muted);font-size:13px">Full name</label><input name="fullName" value="' + fv('fullName') + '">'
      + '<label style="display:block;margin:8px 0 2px;color:var(--muted);font-size:13px">Street address</label><input name="street" value="' + fv('street') + '">'
      + '<label style="display:block;margin:8px 0 2px;color:var(--muted);font-size:13px">Street 2</label><input name="street2" value="' + fv('street2') + '">'
      + '<div class="fi2"><div><label style="display:block;margin:8px 0 2px;color:var(--muted);font-size:13px">City</label><input name="city" value="' + fv('city') + '"></div>'
      + '<div><label style="display:block;margin:8px 0 2px;color:var(--muted);font-size:13px">State/Region</label><input name="state" value="' + fv('state') + '"></div></div>'
      + '<div class="fi2"><div><label style="display:block;margin:8px 0 2px;color:var(--muted);font-size:13px">ZIP/Postal code</label><input name="zip" value="' + fv('zip') + '"></div>'
      + '<div><label style="display:block;margin:8px 0 2px;color:var(--muted);font-size:13px">Country</label><input name="country" value="' + fv('country') + '"></div></div>'
      + '<label style="display:block;margin:8px 0 2px;color:var(--muted);font-size:13px">Phone</label><input name="phone" value="' + fv('phone') + '">'
      + '<label style="display:block;margin:8px 0 2px;color:var(--muted);font-size:13px">Email</label><input name="email" value="' + fv('email') + '">'
      + '<div class="r"><button type="submit">Save</button><button type="button" id="mac">Cancel</button></div>'
      + '<p class="err" id="aerr"></p>';
    modal.append(form);
    document.body.append(modal);
    form.querySelector('#mac').onclick = () => modal.remove();
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(form));
      const payload = { id: a ? a.id : null, ...v };
      const r = await browser.vaultSaveAddress(payload);
      if (r.error) { form.querySelector('#aerr').textContent = r.error; return; }
      modal.remove(); loadAddresses();
    };
  }
  $('add-addr').onclick = () => editAddress(null);

  window.addEventListener('focus', () => { if ($('app').style.display !== 'none') refresh(); });
  init();
</script>
</body>
</html>
