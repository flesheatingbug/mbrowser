<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Setup</title>
<link rel="stylesheet" href="my://assets/theme.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, sans-serif;
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: linear-gradient(145deg, #0f0524 0%, #2d1065 22%, #6d28d9 52%, #a855f7 72%, #f43f5e 88%, #fb923c 100%);
}

/* card */
.wizard-card {
  background: var(--bg);
  color: var(--fg);
  border-radius: 20px;
  box-shadow: 0 28px 80px rgba(0,0,0,.55);
  width: 100%;
  max-width: 600px;
  min-height: 580px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* inputs */
input, select { background: var(--tab); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); padding: 8px 12px; font-size: 14px; width: 100%; outline: none; }
input:focus, select:focus { border-color: var(--accent); }

/* buttons */
button { border: none; border-radius: 999px; padding: 10px 24px; font-size: 14px; cursor: pointer; font-family: inherit; transition: opacity .15s, background .15s; }
.btn-primary { background: var(--accent); color: var(--onaccent); font-weight: 600; }
.btn-primary:hover { opacity: .88; }
.btn-primary:disabled { opacity: .45; cursor: default; }
.btn-ghost { background: transparent; color: var(--muted); border-radius: 999px; }
.btn-ghost:hover { color: var(--fg); }
.btn-secondary { background: var(--tab); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; }
.btn-secondary:hover { border-color: var(--muted); }

/* card header */
.card-header { padding: 18px 24px 0; display: flex; align-items: center; gap: 10px; -webkit-app-region: drag; }
.card-header button, .card-header input { -webkit-app-region: no-drag; }
.logo { width: 30px; height: 30px; border-radius: 8px; -webkit-app-region: no-drag; }
.app-name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.dots { margin-left: auto; display: flex; gap: 7px; align-items: center; }
.close-btn { -webkit-app-region: no-drag; background: none; border: none; border-radius: 50%;
  width: 28px; height: 28px; padding: 0; cursor: pointer; display: grid; place-items: center;
  color: var(--muted); margin-left: 10px; }
.close-btn:hover { background: var(--tab); color: var(--fg); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background .2s; }
.dot.active { background: var(--accent); }
.dot.done { background: var(--muted); }

/* main content */
.content { flex: 1; padding: 20px 28px 16px; overflow-y: auto; display: flex; flex-direction: column; }
h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: -.02em; }
.subtitle { color: var(--muted); margin-bottom: 22px; line-height: 1.5; }
.field { margin-bottom: 14px; }
.field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
.err { color: #ff6b6b; font-size: 13px; min-height: 18px; margin-top: 4px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.section-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

/* option cards */
.cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.card { border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: border-color .15s; }
.card:hover { border-color: var(--muted); }
.card.selected { border-color: var(--accent); }
.card-title { font-weight: 600; margin-bottom: 2px; }
.card-desc { font-size: 12px; color: var(--muted); line-height: 1.4; }
.card .expand { margin-top: 14px; display: none; }
.card.selected .expand { display: block; }

/* toggle */
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle-row:last-child { border-bottom: none; }
.toggle-label { flex: 1; }
.toggle-label b { display: block; }
.toggle-label span { font-size: 12px; color: var(--muted); }
.toggle { width: 42px; height: 24px; border-radius: 12px; border: none; cursor: pointer; position: relative; flex: none; transition: background .15s; padding: 0; }
.toggle.on { background: var(--accent); }
.toggle.off { background: var(--line); }
.toggle::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; top: 3px; transition: left .15s; }
.toggle.on::after { left: 21px; }
.toggle.off::after { left: 3px; }

/* footer */
.card-footer { padding: 14px 28px 20px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--line); }

/* step counter */
.step-count { margin-right: auto; font-size: 12px; color: var(--muted); }

/* server status */
.server-status { font-size: 13px; padding: 8px 0; min-height: 24px; }
.server-status.ok { color: #4cc38a; }
.server-status.err { color: #ff6b6b; }

/* profile picker */
.profile-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.pitem { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; cursor: pointer; }
.pitem:hover { border-color: var(--muted); }
.pitem.selected { border-color: var(--accent); }
.pdot { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; }

/* done step */
.done-icon { width: 52px; height: 52px; border-radius: 50%; background: rgba(76,195,138,.15); display: grid; place-items: center; margin: 0 auto 14px; }
.done-icon svg { width: 26px; height: 26px; }
.done-title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.done-sub { text-align: center; color: var(--muted); line-height: 1.5; }
.summary { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
.summary-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.summary-item svg { flex: none; width: 16px; height: 16px; }

/* feature highlights (step 1) */
.features { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; width: 100%; max-width: 380px; text-align: left; }
.feat { display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px; background: var(--tab); border-radius: 12px; }
.feat-icon { font-size: 20px; flex: none; line-height: 1; }
.feat-text b { display: block; font-size: 13px; }
.feat-text span { font-size: 12px; color: var(--muted); line-height: 1.4; }

/* theme swatches */
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-bottom: 24px; }
.tswatch { border: 2px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color .15s; }
.tswatch:hover { border-color: var(--muted); }
.tswatch.selected { border-color: var(--accent); }
.tswatch-preview { height: 44px; display: flex; flex-direction: column; }
.tswatch-bar { height: 14px; }
.tswatch-body { flex: 1; }
.tswatch-name { padding: 5px 8px 7px; font-size: 12px; font-weight: 500; }

/* search engine grid */
.engine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 24px; }
.ecard { border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color .15s; display: flex; align-items: center; gap: 8px; }
.ecard:hover { border-color: var(--muted); }
.ecard.selected { border-color: var(--accent); }
.ecard-icon { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.ecard-name { font-size: 13px; font-weight: 500; }
</style>
</head>
<body>
<div class="wizard-card">
  <div class="card-header">
    <img class="logo" src="my://assets/logo.png" alt="">
    <span class="app-name">mbrowser</span>
    <div class="dots" id="dots"></div>
    <button class="close-btn" id="close-btn" title="Close" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg>
    </button>
  </div>
  <div class="content" id="content"></div>
  <div class="card-footer" id="footer"></div>
</div>

<script>
const TOTAL_STEPS = 5;
let step = 1;
let status = {};
let serverConnected = false;
let serverProfiles = null;
let selectedServerProfile = null;
let vaultChoice = null;
let vaultFor = null;
let vMaster = '', vConfirm = '', vKey = '', vRemember = true;
let openLast = false;
let blockTrackers = true;
let chosenTheme = null;
let chosenEngine = null;
let profileName = '';
let localProfileName = 'Default (local)';
let standaloneMode = false;
let profileRenamed = false;
let allThemes = [];
let allEngines = [];

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const svgCheck = `<svg viewBox="0 0 20 20" fill="none" stroke="#4cc38a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,10 8,15 16,6"/></svg>`;

document.getElementById('close-btn').onclick = () => browser.wizardCancel();

async function init() {
  status = await browser.wizardStatus() || {};
  profileName = status.profileName || 'Default';
  localProfileName = 'Default (local)';
  openLast = status.openLastProfile || false;
  vRemember = status.remember !== false;
  serverConnected = status.serverConfigured;
  standaloneMode = !serverConnected;
  blockTrackers = status.blockTrackers !== false;

  const tData = await browser.getThemes();
  allThemes = [
    { id: 'system', name: 'Follow system', bg: null },
    ...(tData.presets || []),
  ];
  chosenTheme = tData.current || 'system';

  allEngines = status.searchEngines || [
    { id: 'ddg', name: 'DuckDuckGo' },
    { id: 'google', name: 'Google' },
    { id: 'bing', name: 'Bing' },
    { id: 'wiki', name: 'Wikipedia' },
    { id: 'yt', name: 'YouTube' },
    { id: 'gh', name: 'GitHub' },
  ];
  chosenEngine = status.defaultEngine || 'ddg';
  render();
}

function renderDots() {
  const d = $('dots');
  d.innerHTML = '';
  for (let i = 1; i <= TOTAL_STEPS; i++) {
    const dot = el('div', 'dot' + (i === step ? ' active' : i < step ? ' done' : ''));
    d.append(dot);
  }
}

function renderStep1() {
  const c = $('content');
  c.innerHTML = '';
  const wrap = el('div');
  wrap.style.cssText = 'flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px 0';

  const img = el('img'); img.src = 'my://assets/logo.png'; img.style.cssText = 'width:72px;height:72px;margin-bottom:18px;border-radius:18px';
  const h = el('h2', null, 'Welcome to mbrowser');
  h.style.marginBottom = '8px';
  const sub = el('p', 'subtitle', "Let's get you set up in a few quick steps.");
  sub.style.maxWidth = '320px';

  const feats = el('div', 'features');
  const featData = [
    { icon: '🔖', title: 'Bookmarks & Speed Dial', desc: 'Organise your web with folders and visual speed dials.' },
    { icon: '🔒', title: 'Encrypted Password Vault', desc: 'AES-256 encrypted, unlocked by master password or OS key.' },
    { icon: '🔄', title: 'Self-hosted Sync', desc: 'Sync everything to your own Docker server — no cloud lock-in.' },
    { icon: '🛡️', title: 'Ad & Tracker Blocking', desc: 'Built-in EasyList and uBlock filter support.' },
  ];
  for (const f of featData) {
    const row = el('div', 'feat');
    const icon = el('div', 'feat-icon', f.icon);
    const text = el('div', 'feat-text');
    text.append(el('b', null, f.title), el('span', null, f.desc));
    row.append(icon, text);
    feats.append(row);
  }

  wrap.append(img, h, sub, feats);
  c.append(wrap);

  const f = $('footer');
  f.innerHTML = '';
  const next = el('button', 'btn-primary', 'Get started →');
  next.style.padding = '11px 32px';
  next.onclick = () => { step = 2; render(); };
  f.append(next);
}

// Engine display helpers
const ENGINE_COLORS = { ddg: '#de5833', google: '#4285f4', bing: '#00809d', wiki: '#636363', yt: '#ff0000', gh: '#24292f' };
const ENGINE_ICONS = { ddg: 'D', google: 'G', bing: 'B', wiki: 'W', yt: '▶', gh: '' };
function engineIcon(id) {
  const color = ENGINE_COLORS[id] || '#5b8cff';
  const lbl = ENGINE_ICONS[id] ?? id.slice(0, 2).toUpperCase();
  const ic = el('div', 'ecard-icon', lbl);
  ic.style.background = color;
  if (id === 'gh') {
    ic.innerHTML = `<svg width="14" height="14" viewBox="0 0 16 16" fill="white"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>`;
  }
  return ic;
}

// Step 2: Sync server (was step 3)
function renderStep2() {
  const c = $('content');
  c.innerHTML = '';
  const h = el('h2', null, 'Sync server');
  const sub = el('p', 'subtitle', 'Connect to your self-hosted server to sync bookmarks, passwords and more. Or start standalone — you can connect later in Settings → Sync.');
  c.append(h, sub);

  const cards = el('div', 'cards');

  const cardServer = el('div', 'card' + (serverConnected || !standaloneMode ? ' selected' : ''));
  const serverTitle = el('div', 'card-title', 'Connect to my server');
  const serverDesc = el('div', 'card-desc', 'Sync everything across your devices via your own Docker server.');
  const expand = el('div', 'expand');

  if (serverConnected) {
    const acc = status.syncAccount || {};
    const ok = el('div', 'server-status ok', `✓ Connected as ${acc.user || ''}${acc.profile ? ' · profile: ' + acc.profile : ''}`);
    expand.append(ok);
    const disc = el('button', 'btn-ghost', 'Disconnect'); disc.style.marginTop = '8px';
    disc.onclick = async () => {
      await browser.syncLogout();
      serverConnected = false;
      status.serverConfigured = false;
      status = await browser.wizardStatus() || status;
      render();
    };
    expand.append(disc);
  } else {
    expand.append(renderServerForm(cardServer));
  }
  cardServer.append(serverTitle, serverDesc, expand);
  cardServer.onclick = (e) => {
    if (e.target.closest('input, button, select')) return;
    if (!serverConnected) {
      cardServer.classList.add('selected'); cardStandalone.classList.remove('selected');
      standaloneMode = false;
    }
  };

  const cardStandalone = el('div', 'card' + (!serverConnected && standaloneMode ? ' selected' : ''));
  const saTitle = el('div', 'card-title', 'Start standalone');
  const saDesc = el('div', 'card-desc', 'All data stays on this device. Connect a server later in Settings → Sync.');
  cardStandalone.append(saTitle, saDesc);
  cardStandalone.onclick = () => {
    cardStandalone.classList.add('selected'); cardServer.classList.remove('selected'); serverProfiles = null;
    standaloneMode = true;
  };

  cards.append(cardServer, cardStandalone);
  c.append(cards);

  const f = $('footer');
  f.innerHTML = '';
  const stepCount = el('span', 'step-count', `Step ${step} of ${TOTAL_STEPS}`);
  const back = el('button', 'btn-ghost', '← Back'); back.onclick = () => { step = 1; render(); };
  const next = el('button', 'btn-primary', 'Next →'); next.onclick = () => { step = 3; render(); };
  f.append(stepCount, back, next);
}

function renderServerForm(card) {
  const wrap = el('div');
  let savedCreds = null;

  function showCredForm() {
    wrap.innerHTML = '';
    const fServer = el('div', 'field');
    fServer.append(Object.assign(el('label', null, 'Server address')));
    const iServer = el('input'); iServer.type = 'text'; iServer.placeholder = 'https://sync.yourdomain.com';
    if (savedCreds) iServer.value = savedCreds.server;
    fServer.append(iServer);

    const fUser = el('div', 'field');
    fUser.append(el('label', null, 'Username'));
    const iUser = el('input'); iUser.type = 'text'; iUser.autocomplete = 'username';
    if (savedCreds) iUser.value = savedCreds.username;
    fUser.append(iUser);

    const fPw = el('div', 'field');
    fPw.append(el('label', null, 'Password'));
    const iPw = el('input'); iPw.type = 'password'; iPw.autocomplete = 'current-password';
    fPw.append(iPw);

    const statusEl = el('div', 'server-status');
    const connectBtn = el('button', 'btn-secondary', 'Connect'); connectBtn.style.marginTop = '4px';

    connectBtn.onclick = async () => {
      connectBtn.disabled = true; connectBtn.textContent = 'Connecting…'; statusEl.className = 'server-status';
      const url = iServer.value.trim();
      if (!url) { statusEl.className = 'server-status err'; statusEl.textContent = 'Enter the server address.'; connectBtn.disabled = false; connectBtn.textContent = 'Connect'; return; }
      savedCreds = { server: url, username: iUser.value, password: iPw.value };
      const r = await browser.wizardConnect({ ...savedCreds, profile: selectedServerProfile || '', list: true });
      connectBtn.disabled = false; connectBtn.textContent = 'Connect';
      if (r && r.needTotp) { showOtpForm(); return; }
      if (r && r.needProfile) { showProfilePicker(r.profiles); return; }
      if (r && r.ok) {
        serverConnected = true; status = await browser.wizardStatus() || status; step = 4; render();
      } else {
        statusEl.className = 'server-status err'; statusEl.textContent = r?.error || 'Connection failed.';
      }
    };
    wrap.append(fServer, fUser, fPw, connectBtn, statusEl);
  }

  function showOtpForm() {
    wrap.innerHTML = '';
    const msg = el('p'); msg.style.cssText = 'margin-bottom:14px;line-height:1.5';
    msg.innerHTML = '<strong>Two-factor authentication</strong><br><span style="color:var(--muted);font-size:13px">Enter the 6-digit code from your authenticator app.</span>';

    const fOtp = el('div', 'field');
    fOtp.append(el('label', null, 'Authenticator code'));
    const iOtp = el('input'); iOtp.type = 'text'; iOtp.inputMode = 'numeric'; iOtp.placeholder = '123 456'; iOtp.autocomplete = 'one-time-code'; iOtp.maxLength = 10;
    iOtp.style.cssText = 'letter-spacing:4px;font-size:20px;text-align:center';
    fOtp.append(iOtp);

    const statusEl = el('div', 'server-status');
    const row = el('div'); row.style.cssText = 'display:flex;gap:8px;margin-top:8px';
    const verifyBtn = el('button', 'btn-primary', 'Verify');
    const backBtn = el('button', 'btn-ghost', 'Back');
    row.append(verifyBtn, backBtn);

    verifyBtn.onclick = async () => {
      verifyBtn.disabled = true; verifyBtn.textContent = 'Verifying…'; statusEl.className = 'server-status';
      const r = await browser.wizardConnect({ ...savedCreds, totp: iOtp.value.replace(/\s/g, ''), profile: selectedServerProfile || '', list: true });
      verifyBtn.disabled = false; verifyBtn.textContent = 'Verify';
      if (r && r.needProfile) { savedCreds.totp = iOtp.value.replace(/\s/g, ''); showProfilePicker(r.profiles); return; }
      if (r && r.ok) {
        serverConnected = true; status = await browser.wizardStatus() || status; step = 4; render();
      } else {
        statusEl.className = 'server-status err'; statusEl.textContent = r?.error || 'Invalid code — try again.';
        iOtp.select();
      }
    };
    backBtn.onclick = () => showCredForm();
    iOtp.onkeydown = (e) => { if (e.key === 'Enter') verifyBtn.click(); };

    wrap.append(msg, fOtp, row, statusEl);
    setTimeout(() => iOtp.focus(), 50);
  }

  function showProfilePicker(profiles) {
    wrap.innerHTML = '';
    const msg = el('p', 'note', profiles.length
      ? 'Choose which server profile to use, or create a new one:'
      : 'No profiles yet — create one to get started:');
    msg.style.marginBottom = '10px';

    const list = el('div', 'profile-list');
    for (const p of profiles) {
      const item = el('div', 'pitem');
      const dot = el('div', 'pdot', p.name[0].toUpperCase()); dot.style.background = '#5b8cff';
      item.append(dot, el('span', null, p.name));
      item.onclick = async () => {
        selectedServerProfile = String(p.id);
        list.querySelectorAll('.pitem').forEach(x => x.classList.remove('selected')); item.classList.add('selected');
        const r = await browser.wizardConnect({ ...savedCreds, profile: selectedServerProfile });
        if (r && r.ok) { serverConnected = true; status = await browser.wizardStatus() || status; step = 4; render(); }
        else { showCredForm(); }
      };
      list.append(item);
    }

    const newSection = el('div'); newSection.style.marginTop = '10px';
    const toggleBtn = el('button', 'btn-ghost', '+ Create new profile on server');
    toggleBtn.style.padding = '6px 0';

    const newForm = el('div');
    newForm.style.cssText = 'display:none; flex-direction:column; gap:8px; margin-top:8px;';

    const nameInput = el('input'); nameInput.type = 'text'; nameInput.placeholder = 'Profile name'; nameInput.value = 'Default';
    const formRow = el('div'); formRow.style.cssText = 'display:flex; gap:8px;';
    const createBtn = el('button', 'btn-primary', 'Create');
    const cancelBtn = el('button', 'btn-ghost', 'Cancel');
    formRow.append(createBtn, cancelBtn);
    const formStatus = el('div', 'server-status');
    newForm.append(nameInput, formRow, formStatus);

    toggleBtn.onclick = () => {
      const show = newForm.style.display === 'none';
      newForm.style.display = show ? 'flex' : 'none';
      if (show) setTimeout(() => nameInput.focus(), 50);
    };
    cancelBtn.onclick = () => { newForm.style.display = 'none'; };
    createBtn.onclick = async () => {
      const name = nameInput.value.trim();
      if (!name) { formStatus.className = 'server-status err'; formStatus.textContent = 'Enter a profile name.'; return; }
      createBtn.disabled = true; createBtn.textContent = 'Creating…'; formStatus.className = 'server-status';
      selectedServerProfile = name;
      const r = await browser.wizardConnect({ ...savedCreds, profile: name, create: true });
      createBtn.disabled = false; createBtn.textContent = 'Create';
      if (r && r.ok) { serverConnected = true; status = await browser.wizardStatus() || status; step = 4; render(); }
      else { formStatus.className = 'server-status err'; formStatus.textContent = r?.error || 'Failed to create profile.'; }
    };
    nameInput.onkeydown = (e) => { if (e.key === 'Enter') createBtn.click(); };

    newSection.append(toggleBtn, newForm);
    if (!profiles.length) { newForm.style.display = 'flex'; setTimeout(() => nameInput.focus(), 50); }

    const backBtn = el('button', 'btn-ghost', '← Back'); backBtn.style.marginTop = '4px';
    backBtn.onclick = () => showCredForm();
    wrap.append(msg, list, newSection, backBtn);
  }

  showCredForm();
  return wrap;
}

// Step 3: Theme + search engine (was step 2)
function renderStep3() {
  const c = $('content');
  c.innerHTML = '';
  c.append(el('h2', null, 'Make it yours'));
  c.append(el('p', 'subtitle', 'Choose a theme and your default search engine.'));

  c.append(el('div', 'section-label', 'Theme'));
  const grid = el('div', 'theme-grid');

  for (const t of allThemes) {
    const sw = el('div', 'tswatch' + (chosenTheme === t.id ? ' selected' : ''));
    if (t.bg) {
      const preview = el('div', 'tswatch-preview');
      const bar = el('div', 'tswatch-bar'); bar.style.background = t.active || t.bg;
      const body = el('div', 'tswatch-body'); body.style.background = t.bg;
      const dot = el('div');
      dot.style.cssText = `width:10px;height:10px;border-radius:50%;background:${t.accent};position:relative;top:7px;left:8px`;
      body.append(dot);
      preview.append(bar, body);
      sw.append(preview);
    } else {
      const preview = el('div', 'tswatch-preview');
      preview.style.cssText = 'background:linear-gradient(135deg,#1e1f22 50%,#e4e7ec 50%)';
      sw.append(preview);
    }
    const name = el('div', 'tswatch-name', t.name);
    sw.append(name);
    sw.onclick = async () => {
      chosenTheme = t.id;
      grid.querySelectorAll('.tswatch').forEach((x) => x.classList.remove('selected'));
      sw.classList.add('selected');
      await browser.setSetting('appearance.themeId', t.id);
    };
    grid.append(sw);
  }
  c.append(grid);

  c.append(el('div', 'section-label', 'Default search engine'));
  const egrid = el('div', 'engine-grid');
  for (const eng of allEngines) {
    const ec = el('div', 'ecard' + (chosenEngine === eng.id ? ' selected' : ''));
    ec.append(engineIcon(eng.id), el('span', 'ecard-name', eng.name));
    ec.onclick = async () => {
      chosenEngine = eng.id;
      egrid.querySelectorAll('.ecard').forEach((x) => x.classList.remove('selected'));
      ec.classList.add('selected');
      await browser.setSetting('search.default', eng.id);
    };
    egrid.append(ec);
  }
  c.append(egrid);

  const f = $('footer');
  f.innerHTML = '';
  const stepCount = el('span', 'step-count', `Step ${step} of ${TOTAL_STEPS}`);
  const back = el('button', 'btn-ghost', '← Back'); back.onclick = () => { step = 2; render(); };
  const next = el('button', 'btn-primary', 'Next →'); next.onclick = () => { step = 4; render(); };
  f.append(stepCount, back, next);
}

function renderStep4() {
  const c = $('content');
  c.innerHTML = '';
  const h = el('h2', null, standaloneMode ? 'New local profile' : 'Your profile');
  const sub = el('p', 'subtitle', standaloneMode
    ? 'A new local profile will be created. Your existing profile is kept and can be opened separately.'
    : 'Customise how mbrowser handles profiles and passwords.');
  c.append(h, sub);

  const fName = el('div', 'field');
  const lName = el('label', null, standaloneMode ? 'Local profile name' : 'Profile name');
  const iName = el('input'); iName.type = 'text'; iName.value = standaloneMode ? localProfileName : profileName;
  iName.oninput = () => { if (standaloneMode) localProfileName = iName.value; else profileName = iName.value; };
  fName.append(lName, iName);
  c.append(fName);

  const toggles = el('div'); toggles.style.marginBottom = '20px';

  const olRow = el('div', 'toggle-row');
  const olLabel = el('div', 'toggle-label');
  olLabel.append(el('b', null, 'Open last-used profile on launch'), el('span', null, 'Skip the profile chooser and jump straight back in.'));
  const olBtn = el('button', 'toggle ' + (openLast ? 'on' : 'off'));
  olBtn.onclick = () => { openLast = !openLast; olBtn.className = 'toggle ' + (openLast ? 'on' : 'off'); };
  olRow.append(olLabel, olBtn);

  const btRow = el('div', 'toggle-row');
  const btLabel = el('div', 'toggle-label');
  btLabel.append(el('b', null, 'Block trackers & ads'), el('span', null, 'Uses EasyList and uBlock filters.'));
  const btBtn = el('button', 'toggle ' + (blockTrackers ? 'on' : 'off'));
  btBtn.onclick = () => { blockTrackers = !blockTrackers; btBtn.className = 'toggle ' + (blockTrackers ? 'on' : 'off'); };
  btRow.append(btLabel, btBtn);

  toggles.append(olRow, btRow);
  c.append(toggles);

  const syncing = serverConnected && !standaloneMode;
  const sv = status.serverVault;
  if (vaultChoice === null || vaultFor !== syncing) {
    vaultChoice = syncing ? (sv && sv.exists ? 'join' : 'master') : 'device';
    vaultFor = syncing;
  }
  const vh = el('h3', null, 'Password manager'); vh.style.marginBottom = '10px';
  c.append(vh);
  if (status.vaultExists) {
    c.append(el('p', 'note', status.vaultDeviceMode ? '✓ Vault is set up without a master password (this computer only).' : '✓ Vault is already set up.'));
  } else {
    const banner = el('p', 'note', syncing
      ? 'A master password is essential to sync your passwords between devices. Without one, your other devices cannot read the vault.'
      : 'Passwords stay on this computer. To sync them to other devices later, switch to a master password in Settings → Passwords.');
    banner.style.marginBottom = '10px';
    if (syncing) banner.style.color = 'var(--fg)';
    c.append(banner);
    const vcards = el('div', 'cards');
    const cards = {};
    const choose = (id) => { vaultChoice = id; for (const k in cards) cards[k].classList.toggle('selected', k === id); };
    const mkCard = (id, title, desc, build) => {
      const card = el('div', 'card' + (vaultChoice === id ? ' selected' : ''));
      card.append(el('div', 'card-title', title), el('div', 'card-desc', desc));
      if (build) { const ex = el('div', 'expand'); build(ex); ex.onclick = (e) => e.stopPropagation(); card.append(ex); }
      card.onclick = () => choose(id);
      cards[id] = card; vcards.append(card);
    };
    const input = (parent, label, type, get, set) => {
      const fd = el('div', 'field'); fd.append(el('label', null, label));
      const i = el('input'); i.type = type; i.value = get(); i.autocomplete = 'off'; i.oninput = () => set(i.value);
      fd.append(i); parent.append(fd);
    };
    const remember = (parent) => {
      const row = el('div', 'toggle-row');
      const lb = el('div', 'toggle-label'); lb.append(el('b', null, 'Only type it once on this computer'), el('span', null, 'Remembered with your OS account; you can turn this off later.'));
      const tg = el('button', 'toggle ' + (vRemember ? 'on' : 'off'));
      tg.onclick = () => { vRemember = !vRemember; tg.className = 'toggle ' + (vRemember ? 'on' : 'off'); };
      row.append(lb, tg); parent.append(row);
    };
    if (syncing && sv && sv.exists) {
      mkCard('join', 'Use the vault on your server (recommended)', sv.device
        ? 'Your server’s vault has no master password. Paste its key from the computer that made it.'
        : 'Your server already has a password vault. Enter its master password.', (ex) => {
        if (sv.device) input(ex, 'Vault key', 'text', () => vKey, (v) => { vKey = v; });
        else { input(ex, 'Master password', 'password', () => vMaster, (v) => { vMaster = v; }); remember(ex); }
      });
    } else {
      mkCard('master', 'Master password' + (syncing ? ' (recommended)' : ''), 'One password opens your vault on every device. Needed to sync passwords.', (ex) => {
        input(ex, 'Master password', 'password', () => vMaster, (v) => { vMaster = v; });
        input(ex, 'Repeat it', 'password', () => vConfirm, (v) => { vConfirm = v; });
        remember(ex);
        ex.append(el('div', 'note', 'Write it down: it cannot be recovered.'));
      });
    }
    mkCard('device', 'No password (this computer only)', 'Opens automatically, protected by your OS account. Other devices cannot read the vault.');
    mkCard('skip', 'Set up later', 'Create the vault the first time you save a password.');
    c.append(vcards);
  }

  const f = $('footer');
  f.innerHTML = '';
  const stepCount = el('span', 'step-count', `Step ${step} of ${TOTAL_STEPS}`);
  const errEl = el('span', 'err', '');
  const back = el('button', 'btn-ghost', '← Back'); back.onclick = () => { step = 3; render(); };
  const next = el('button', 'btn-primary', 'Finish →');
  next.onclick = async () => {
    next.disabled = true; next.textContent = 'Saving…'; errEl.textContent = '';
    await browser.setSetting('privacy.blockTrackers', blockTrackers);
    if (standaloneMode) {
      const name = localProfileName.trim() || 'Default (local)';
      const r = await browser.wizardCreateProfile(name);
      if (r && r.error) { errEl.textContent = r.error; next.disabled = false; next.textContent = 'Finish →'; return; }
      profileRenamed = true;
    } else {
      if (profileName.trim() && profileName !== status.profileName) {
        const r = await browser.wizardRenameProfile(profileName.trim());
        if (r && r.error) { errEl.textContent = r.error; next.disabled = false; next.textContent = 'Finish →'; return; }
        profileRenamed = true;
      }
    }
    await browser.wizardSetOpenLast(openLast);
    if (!status.vaultExists && vaultChoice && vaultChoice !== 'skip') {
      const r = await browser.wizardVaultSetup({ mode: vaultChoice, master: vMaster, confirm: vConfirm, key: vKey, remember: vRemember });
      if (r && r.error) { errEl.textContent = 'Vault: ' + r.error; next.disabled = false; next.textContent = 'Finish →'; return; }
      status.vaultExists = true;
    }
    step = 5; render();
  };
  f.append(stepCount, errEl, back, next);
}

function renderStep5() {
  const c = $('content');
  c.innerHTML = '';
  c.style.alignItems = 'center';
  c.style.justifyContent = 'center';
  c.style.textAlign = 'center';

  const icon = el('div', 'done-icon');
  icon.innerHTML = svgCheck;
  const title = el('div', 'done-title', "You’re all set!");
  const sub = el('div', 'done-sub', 'mbrowser is ready to use.');

  const items = [];
  const themeObj = allThemes.find((t) => t.id === chosenTheme);
  if (themeObj) items.push('Theme: ' + themeObj.name);
  const engObj = allEngines.find((e) => e.id === chosenEngine);
  if (engObj) items.push('Search: ' + engObj.name);
  if (serverConnected) items.push('Connected to sync server');
  const shownName = standaloneMode ? localProfileName : profileName;
  if (standaloneMode) items.push(`New local profile: ${shownName || 'Default (local)'}`);
  else if (profileRenamed || (shownName && shownName !== status.profileName)) items.push(`Profile: ${shownName}`);
  if (openLast) items.push('Opens last-used profile on launch');
  if (!blockTrackers) items.push('Ad/tracker blocking off');
  if (vaultChoice === 'master' || (vaultChoice === 'join' && !(status.serverVault && status.serverVault.device))) items.push('Password vault: master password' + (vRemember ? ' (remembered)' : ''));
  else if (vaultChoice === 'join') items.push('Password vault: joined the server’s vault');
  else if (vaultChoice === 'device') items.push('Password vault: this computer only');

  const summary = el('div', 'summary');
  summary.style.textAlign = 'left';
  for (const text of items) {
    const item = el('div', 'summary-item');
    item.innerHTML = svgCheck + `<span>${text}</span>`;
    summary.append(item);
  }

  const start = el('button', 'btn-primary', 'Start browsing');
  start.style.cssText = 'margin-top:20px;padding:11px 32px';
  start.onclick = async () => { await browser.wizardDone(); };

  c.append(icon, title, sub, ...(items.length ? [summary] : []), start);
  $('footer').innerHTML = '';
}

function render() {
  renderDots();
  const c = $('content');
  c.style.alignItems = '';
  c.style.justifyContent = '';
  c.style.textAlign = '';
  if (step === 1) renderStep1();
  else if (step === 2) renderStep2();
  else if (step === 3) renderStep3();
  else if (step === 4) renderStep4();
  else if (step === 5) renderStep5();
}

init();
</script>
</body>
</html>
