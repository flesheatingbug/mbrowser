<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" id="themecss" href="my://assets/theme.css">
<link rel="stylesheet" href="my://assets/common.css">
<style>
  .layout { display:flex; min-height:100vh; }
  nav { width:230px; padding:28px 12px; border-right:1px solid var(--line); position:sticky; top:0; height:100vh; flex:none; }
  nav h1 { font-size:18px; padding:0 14px; margin-bottom:12px; }
  nav button { display:block; width:100%; text-align:left; border:0; background:none; padding:10px 14px; border-radius:8px; }
  nav button:hover { background:var(--tab); }
  nav button.on { background:var(--accent); color:var(--onaccent); }
  /* beta items stand out in amber while Beta features is on */
  nav button.beta { color:#f5a524; box-shadow:inset 3px 0 0 #f5a524; }
  nav button.beta:hover { background:rgba(245,165,36,.14); }
  nav button.beta.on { background:#f5a524; color:#1b1200; }
  nav button.beta::after, .row.beta label::after { content:'BETA'; margin-left:8px; padding:1px 6px; border-radius:6px; font-size:10px; font-weight:700; letter-spacing:.05em; background:rgba(245,165,36,.2); color:#f5a524; vertical-align:middle; }
  nav button.beta.on::after { background:rgba(27,18,0,.18); color:#1b1200; }
  .row.beta { box-shadow:inset 3px 0 0 #f5a524; padding-left:12px; border-radius:6px; background:rgba(245,165,36,.07); }
  #settings-search { width:100%; padding:7px 10px; margin-bottom:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; font-size:13px; outline:none; box-sizing:border-box; }
  #settings-search:focus { border-color:var(--accent); }
  main { flex:1; max-width:820px; padding:40px 56px 100px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1px solid var(--line); }
  .row:has(.hnform) { flex-wrap:wrap; }
  .hnform { flex-basis:100%; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .hnform input { width:200px; }
  .row.col { flex-direction:column; align-items:stretch; }
  .row label { flex:1; }
  .row .help { display:block; color:var(--muted); font-size:12px; margin-top:3px; }
  .row input[type=text], .row input[type=password], .row input[type=number], .row select { width:300px; }
  .row textarea { width:100%; min-height:90px; font-family:ui-monospace, monospace; font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:6px 4px; text-align:left; border-bottom:1px solid var(--line); font-weight:normal; }
  th { color:var(--muted); font-size:12px; }
  td input[type=text] { width:100%; }
  kbd { background:var(--tab); border:1px solid var(--line); border-radius:5px; padding:2px 7px; font-size:12px; }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .msg { color:var(--muted); font-size:13px; min-height:20px; }
  .themes { display:grid; grid-template-columns:repeat(auto-fill, 128px); gap:12px; margin:10px 0 18px; }
  .tcard { border:2px solid var(--line); border-radius:12px; padding:8px; cursor:pointer; background:var(--tab); }
  .tcard:hover { border-color:var(--muted); }
  .tcard.on { border-color:var(--accent); }
  .tprev { height:54px; border-radius:8px; position:relative; overflow:hidden; border:1px solid rgba(128,128,128,.25); }
  .tprev i { position:absolute; left:6px; top:6px; width:46px; height:9px; border-radius:4px; }
  .tprev b { position:absolute; left:6px; right:6px; bottom:6px; height:16px; border-radius:8px; }
  .tprev u { position:absolute; right:8px; top:6px; width:9px; height:9px; border-radius:50%; }
  .tname { margin-top:6px; font-size:12px; text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .editor { display:grid; grid-template-columns:140px 1fr; gap:8px 12px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:12px; margin-bottom:14px; }
</style>
</head>
<body>
<div class="layout">
  <nav id="nav">
    <h1>Settings</h1>
    <input type="search" id="settings-search" placeholder="Search settings…" autocomplete="off">
  </nav>
  <main id="main"></main>
</div>
<script>
  const CATS = [
    ['general', 'General'], ['appearance', 'Appearance'], ['startpage', 'Start Page'], ['tabs', 'Tabs'], ['search', 'Search'],
    ['privacy', 'Privacy'], ['adblocker', 'Adblocker'], ['passwords', 'Passwords'], ['bookmarks', 'Bookmarks'], ['history', 'History'], ['downloads', 'Downloads'], ['extensions', 'Extensions'], ['keyboard', 'Keyboard'],
    ['sync', 'Sync'], ['homenet', 'Home network'], ['server', 'Server Admin'], ['import', 'Import'], ['profiles', 'Profiles'], ['about', 'About'],
  ];
  const BETA_CATS = new Set(['extensions']);   // whole pages that are beta features
  const FIELDS = {
    general: [
      { path: 'general.startup', label: 'On startup', type: 'select', options: [['start', 'Open the start page'], ['home', 'Open the homepage'], ['restore', 'Restore the last session']] },
      { path: 'general.homepage', label: 'Homepage', type: 'text' },
      { path: 'general.browserId', label: 'Identify as', type: 'select', options: [['auto', 'Automatic: Firefox on Google sites, Chrome elsewhere (recommended)'], ['chrome', 'Chrome everywhere'], ['firefox', 'Firefox everywhere'], ['safari', 'Safari'], ['none', 'mbrowser / Electron (no spoofing)']], help: 'Some sites show “unsupported browser” banners otherwise. Restart the browser after changing this. With Firefox or Safari nothing is faked: the browser simply says it is that browser.' },
      { path: 'general.autoUpdate', label: 'Check for updates automatically', type: 'toggle', help: 'Looks every few hours and shows a notice in the status bar. Turn off to only check from the menu.' },
      { path: 'general.askDefaultBrowser', label: 'Ask to make mbrowser the default browser (Windows)', type: 'toggle', help: 'Shows a notice under the toolbar while another browser is the default.' },
      { path: 'general.beta', label: 'Beta features', type: 'toggle', help: 'Shows features that are still being tested, such as Extensions. Off by default and only for this computer. Turning it off hides them again.' },
      { path: 'general.splitView', label: 'Split view (tiling)', type: 'toggle', beta: true, help: 'Show tabs side by side: drag a tab onto the page, use Ctrl+Alt+S or the tab menu. Still being tested; turn it off if it misbehaves.' },
      { path: 'general.newTab', label: 'New tab page', type: 'select', options: [['start', 'Start page'], ['home', 'Homepage'], ['blank', 'Blank page']] },
      { path: 'pages.mouseGestures', label: 'Mouse gestures', type: 'toggle', help: 'Hold the right mouse button and drag: left = back, right = forward, down = new tab, down then right = close tab, up = scroll to top, up then down = reload. A plain right-click still opens the menu. (Pages that use the right button themselves, such as maps and games, see it only on release.)' },
      { path: 'pages.defaultZoom', label: 'Default page zoom (%)', type: 'number', min: 30, max: 300, help: 'Applies to newly opened tabs.' },
    ],
    appearance: [
      { path: 'appearance.nativeTitleBar', label: 'Use the system title bar', type: 'toggle', help: 'Takes effect for new windows after a restart. Off = no title bar, the tab strip carries the window buttons.' },
      { path: 'appearance.bookmarksBar', label: 'Show the bookmarks bar', type: 'toggle', help: 'A row of bookmarks under the address bar: the ones you put in the folder called "Bookmarks bar". Ctrl+Shift+B toggles it.' },
      { path: 'appearance.forceDark', label: 'Force dark mode on websites', type: 'toggle', help: 'Darkens pages that only come in a light design. Photos and video keep their colours. Some pages look odd; turn it off per page from the menu (Page > Force dark mode).' },
      { path: 'appearance.statusBar', label: 'Show the status bar', type: 'toggle', help: 'Loading progress, link addresses, zoom level and blocked trackers along the bottom.' },
      { path: 'appearance.tabBar', label: 'Tab bar position', type: 'select', options: [['top', 'Top'], ['left', 'Left (vertical tabs)']] },
    ],
    startpage: [
      { path: 'startPage.tileSize', label: 'Speed dial size (px)', type: 'number', min: 90, max: 260, help: 'Width of each speed dial tile.' },
      { path: 'startPage.dialStyle', label: 'Speed dial style', type: 'select', options: [['cards', 'Cards with page previews'], ['icons', 'Icons only (like a phone home screen)']], help: 'Icons are fetched from each site itself and kept on this computer.' },
      { path: 'startPage.wallpaper', label: 'Wallpaper', type: 'wallpaper', help: 'Fills the start page. Pick one of the built-in pictures or your own.' },
      { path: 'startPage.thumbnails', label: 'Show page thumbnails', type: 'toggle', help: 'Thumbnails are captured automatically when you visit a speed dial site.' },
      { path: 'startPage.showSearch', label: 'Show the search box', type: 'toggle' },
      { path: 'startPage.showBrand', label: 'Show browser name on the start page', type: 'toggle' },
      { path: 'startPage.showTitles', label: 'Show speed dial titles', type: 'toggle' },
      { path: 'startPage.gap', label: 'Space between tiles (px)', type: 'number', min: 0, max: 40 },
      { path: 'startPage.margins', label: 'Page margins', type: 'select', options: [['normal', 'Normal'], ['narrow', 'Narrow'], ['none', 'None']] },
      { path: 'startPage.showAddButton', label: 'Show the "+ Add" button', type: 'toggle' },
      { path: 'startPage.columns', label: 'Max columns (0 = auto)', type: 'number', min: 0, max: 12, help: 'Tiles wrap to fewer columns when the window is narrow. 0 fits as many as possible.' },
      { path: 'startPage.showDashboard', label: 'Show the server dashboard tab', type: 'toggle', help: 'Links to the sync server dashboard. Only shown when a server is configured.' },
      { path: 'startPage.extraTabs.notes', label: 'Show Notes tab on start page', type: 'toggle' },
    ],
    tabs: [
      { path: 'tabs.newTabFocus', label: 'When opening a new tab, focus the', type: 'select', options: [['address', 'Address bar'], ['page', 'Page (search box on the start page)']] },
      { path: 'tabs.newTabPosition', label: 'Open new tabs', type: 'select', options: [['end', 'At the end of the tab bar'], ['afterCurrent', 'Next to the current tab']] },
      { path: 'tabs.wheelScrolls', label: 'Scroll mouse wheel on the tab bar to switch tabs', type: 'toggle' },
      { path: 'tabs.clickTabScrollsTop', label: 'Click the active tab to scroll the page to the top', type: 'toggle', help: 'When you are scrolled down a page, clicking its tab scrolls back to the top.' },
      { path: 'tabs.lazyBackground', label: 'Only load background tabs when you switch to them (turn off to load them right away)', type: 'toggle', help: 'Prevents audio, videos, and network activity from tabs opened in the background until you click them.' },
      { path: 'tabs.pauseBackgroundVideo', label: 'Pause videos in background tabs', type: 'toggle', help: 'A video that plays in a tab you are not looking at is paused, and carries on when you switch back to it.' },
    ],
    privacy: [
      { path: 'privacy.blockTrackers', label: 'Block ads and trackers', type: 'toggle', help: 'Blocks third-party requests to a built-in list of known ad and tracking domains. Click the shield in the toolbar to allow a single site.' },
      { path: 'privacy.doNotTrack', label: 'Send “Do Not Track” and Global Privacy Control', type: 'toggle' },
      { path: 'privacy.passkeys', label: 'Allow passkeys and security keys', type: 'toggle', help: 'Off by default: sites fall back to a password, so Windows does not pop up a passkey or security key window while you sign in. Turn on if you sign in with a passkey. Applies to tabs you open afterwards.' },
      { path: 'privacy.customBlocklist', label: 'Extra domains to block', type: 'textarea', help: 'One domain per line. Subdomains are included.' },
      { path: 'privacy.allowSites', label: 'Sites where blocking is off', type: 'lines', help: 'One hostname per line.' },
      { path: 'privacy.certExceptions', label: 'Sites with accepted certificate errors', type: 'lines', help: 'Hostnames you chose to open despite an untrusted (e.g. self-signed) certificate. One per line; delete a line to stop trusting it.' },
      { path: 'privacy.clearOnExit.cookies', label: 'Clear cookies and site data when the browser closes', type: 'toggle' },
      { path: 'privacy.clearOnExit.cache', label: 'Clear the cache when the browser closes', type: 'toggle' },
    ],
    passwords: [
      { path: 'passwords.enabled', label: 'Offer to save and fill passwords', type: 'toggle' },
      { path: 'passwords.inPrivate', label: 'Also in private tabs', type: 'toggle', help: 'Offer to save new logins in private tabs too. Filling saved logins works in private tabs either way.' },
      { path: 'passwords.sync', label: 'Sync the password vault to your server', type: 'toggle' },
      { path: 'passwords.neverSave', label: 'Sites where saving is switched off', type: 'lines', help: 'One address per line.' },
    ],
    downloads: [
      { path: 'downloads.askWhere', label: 'Ask where to save each file', type: 'toggle' },
      { path: 'downloads.directory', label: 'Download folder', type: 'folder', help: 'Leave empty to use your system Downloads folder.' },
    ],
    adblocker: [
      { path: 'privacy.blockTrackers', label: 'Enable ad and tracker blocking', type: 'toggle', help: 'Blocks third-party requests matching the built-in domain list.' },
      { path: 'privacy.doNotTrack', label: 'Send "Do Not Track" and Global Privacy Control headers', type: 'toggle' },
      { path: 'privacy.allowSites', label: 'Sites where blocking is off', type: 'lines', help: 'One hostname per line. Blocking is fully disabled for these sites.' },
      { path: 'privacy.customBlocklist', label: 'Extra domains to block', type: 'textarea', help: 'One domain per line. Subdomains are included automatically.' },
    ],
    bookmarks: [
      { path: 'startPage.extraTabs.bookmarks', label: 'Show Bookmarks tab on start page', type: 'toggle', help: 'Bookmarks are managed at my://bookmarks (Ctrl+Shift+O) and sync with your server.' },
    ],
    history: [
      { path: 'startPage.extraTabs.history', label: 'Show History tab on start page', type: 'toggle', help: 'History is at my://history (Ctrl+H) and syncs with your server.' },
      { path: 'privacy.clearOnExit.history', label: 'Clear history when the browser closes', type: 'toggle' },
    ],
    sync: [
      { path: 'sync.device', label: 'Device name', type: 'text', help: 'Shown on your other devices. Defaults to the hostname.' },
      { path: 'sync.settings', label: 'Sync settings and speed dials', type: 'toggle', help: 'Themes, search engines, speed dials, shortcuts, panel and similar. Per-device things (system title bar, download folder, accepted certificates) stay local.' },
    ],

  };

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  let S = null, cur = (location.hash || '#general').slice(1), searchQuery = '';

  const get = (p) => p.split('.').reduce((o, k) => (o == null ? o : o[k]), S);

  const TB_ITEMS = [['back', 'Back'], ['forward', 'Forward'], ['reload', 'Reload'], ['address', 'Address bar'], ['shield', 'Tracker blocker'], ['downloads', 'Downloads'], ['star', 'Bookmark star'], ['profile', 'Profile']];
  const TB_EXTRA = [['key', 'Saved logins key (inside the address bar)'], ['siteinfo', 'Site information (inside the address bar)'], ['reader', 'Reader view (inside the address bar, on article pages)']];
  async function homenetSection(m) {
    m.append(el('p', 'muted', 'Open devices on your home network from anywhere. Typing 192.168.1.1, router.lan or nas:8080 then opens YOUR home router or NAS, not whatever network this computer is on. Everything else browses normally. It works through your own sync server (which needs ALLOW_TUNNEL=true). Servers, sign-ins and the switch below belong to this profile only.'));
    m.append(field({ path: 'general.homeNetwork', label: 'Home network mode', type: 'toggle', help: 'A status-bar chip shows when it is on. Turning it on checks the server first.' }));
    const box = el('div'); m.append(box);
    const msg = el('p', 'muted'); 
    let st = null;
    const draw = (v) => {
      st = v; box.textContent = '';
      if (v.error) msg.textContent = v.error; else msg.textContent = '';
      box.append(el('h3', null, 'Servers'));
      if (!v.servers.length) box.append(el('p', 'muted', 'No servers yet. Add the address of a sync server below.'));
      for (const s of v.servers) {
        const row = el('div', 'row');
        const lab = el('div', 'lab'); lab.append(el('b', null, s.name), el('div', 'help', s.url));
        lab.append(el('div', 'help', s.key ? 'Uses this profile\u2019s sync key (less secure)' : (s.signedIn ? 'Signed in as ' + s.user : 'Not signed in')));
        const right = el('div', 'right');
        const use = el('label', 'help', 'Use this one '); const rd = el('input'); rd.type = 'radio'; rd.name = 'hn-active'; rd.checked = v.active === s.id;
        rd.onchange = async () => draw(await browser.homenetSelect(s.id)); use.append(rd); right.append(use);
        if (!s.key) {
          if (s.signedIn) { const lo = el('button', null, 'Sign out'); lo.onclick = async () => draw(await browser.homenetLogout(s.id)); right.append(lo); }
          else { const li = el('button', null, 'Sign in'); li.onclick = () => form(s, row); right.append(li); }
        }
        if (v.syncUrl && v.syncUrl === s.url) {
          const k = el('label', 'help', 'Use sync key '); const kc = el('input'); kc.type = 'checkbox'; kc.checked = s.key;
          kc.title = 'Skips the password. The server must allow it (TUNNEL_KEY_AUTH=true). Less secure.';
          kc.onchange = async () => draw(await browser.homenetSetKey(s.id, kc.checked)); k.append(kc); right.append(k);
        }
        const rm = el('button', null, 'Remove'); rm.onclick = async () => draw(await browser.homenetRemove(s.id)); right.append(rm);
        row.append(lab, right); box.append(row);
      }
      box.append(el('h3', null, 'Addresses that use the home network'));
      box.append(el('p', 'muted', 'One per line: a range such as 192.168.50.0/24, a single address, or a name such as nas.example.com or .lan. Leave it empty for the usual home ranges (192.168.x.x, 10.x.x.x, 172.16-31.x.x). Names without a dot and names ending in .local, .lan, .home or .internal always use it. If you use ALLOW_TUNNEL with TUNNEL_ALLOW on the server, it must allow the same ranges.'));
      const ta = el('textarea'); ta.rows = 4; ta.style.cssText = 'width:100%;font-family:monospace;'; ta.placeholder = '192.168.50.0/24\n10.8.0.0/16'; ta.value = v.ranges || '';
      const sv = el('button', null, 'Save addresses'); sv.onclick = async () => { const r = await browser.homenetSetRanges(ta.value); draw(r); msg.textContent = 'Saved.'; };
      box.append(ta, sv);
      box.append(el('h3', null, 'Add a server'));
      const name = el('input'); name.placeholder = 'Name (e.g. Home)';
      const url = el('input'); url.placeholder = 'https://sync.example.com';
      const add = el('button', null, 'Add');
      add.onclick = async () => { const r = await browser.homenetAdd(name.value, url.value); draw(r); };
      const bar = el('div', 'row'); bar.append(name, url, add); box.append(bar);
      box.append(msg);
    };
    const form = (s, row) => {
      if (row.querySelector('.hnform')) return;
      const f = el('div', 'hnform');
      const u = el('input'); u.placeholder = 'User name'; u.autocomplete = 'username';
      const p = el('input'); p.type = 'password'; p.placeholder = 'Password'; p.autocomplete = 'current-password';
      const o = el('input'); o.placeholder = 'One-time code (if you use one)'; o.inputMode = 'numeric'; o.autocomplete = 'one-time-code';
      const go = el('button', null, 'Sign in'); const note = el('div', 'help');
      const submit = async () => {
        go.disabled = true; note.textContent = 'Signing in…';
        const r = await browser.homenetLogin(s.id, { username: u.value, password: p.value, otp: o.value });
        go.disabled = false;
        if (r.error) { note.textContent = r.error; if (r.needTotp) o.focus(); return; }
        draw(r);
      };
      go.onclick = submit; [u, p, o].forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); }));
      f.append(u, p, o, go, note); row.append(f); u.focus();
    };
    draw(await browser.homenetList());
  }

  async function extensionsSection(m) {
    m.append(el('p', 'muted', 'Beta. Install an extension from the Chrome Web Store (paste its link), or load an unpacked one (a folder containing manifest.json). Only part of the Chrome extension API exists in this browser: content scripts and simple extensions usually work; extensions that rely on a background service worker, blocking network requests or toolbar popups may not. Extensions apply to normal tabs, not private ones. Turning one off may need a restart to take full effect.'));
    const box = el('div'); m.append(box);
    const msg = el('p', 'muted'); m.append(msg);
    const reloadNote = el('p', 'muted'); reloadNote.style.cssText = 'display:none'; reloadNote.textContent = 'Reload open tabs for the extension to take effect.'; m.append(reloadNote);
    function draw(listOrResult) {
      const list = Array.isArray(listOrResult) ? listOrResult : (listOrResult && listOrResult.list) || [];
      if (listOrResult && listOrResult.reloadNeeded) reloadNote.style.display = '';
      box.textContent = '';
      if (!list.length) box.append(el('p', 'muted', 'No extensions added yet.'));
      for (const e of list) {
        const row = el('div', 'row');
        const lab = el('label', null, e.name + (e.version ? '  v' + e.version : ''));
        if (e.hasSW) { const badge = el('span', 'help', ' · needs background worker · popup may be blank'); badge.style.color = 'var(--muted)'; lab.append(badge); }
        lab.append(el('span', 'help', e.path + (e.error ? '  ·  ' + e.error : e.enabled ? (e.loaded ? '  ·  running' : '  ·  not loaded') : '')));
        const right = el('span'); right.style.cssText = 'display:flex;gap:8px;align-items:center';
        const cb = el('input'); cb.type = 'checkbox'; cb.checked = e.enabled; cb.title = 'Enabled';
        cb.onchange = async () => draw(await browser.extensionsToggle(e.path, cb.checked));
        const rm = el('button', 'danger', 'Remove');
        rm.onclick = async () => draw(await browser.extensionsRemove(e.path));
        const pin = el('label', 'help', 'Toolbar '); const pc = el('input'); pc.type = 'checkbox'; pc.checked = !e.hidden; pc.title = 'Show in the toolbar';
        pc.onchange = async () => draw(await browser.extensionsPin(e.path, pc.checked)); pin.append(pc);
        right.append(pin);
        if (e.hasOptions && e.loaded) { const ob = el('button', null, 'Options'); ob.onclick = () => browser.extensionsOptions(e.path); right.append(ob); }
        right.append(cb, rm); row.append(lab, right); box.append(row);
      }
    }
    draw(await browser.extensionsList());
    const store = el('div'); store.style.cssText = 'display:flex;gap:8px;margin:10px 0';
    const link = el('input'); link.type = 'text'; link.placeholder = 'Chrome Web Store link or extension id'; link.style.flex = '1';
    const inst = el('button', null, 'Install');
    inst.onclick = async () => { inst.disabled = true; msg.textContent = 'Downloading…'; const r = await browser.extensionsAddStore(link.value); inst.disabled = false; msg.textContent = r.error || (r.list && r.list.length ? 'Done.' : ''); if (!r.error) link.value = ''; draw(r); };
    store.append(link, inst); m.append(store);
    const add = el('button', null, 'Add unpacked extension…');
    add.onclick = async () => { const r = await browser.extensionsAdd(); msg.textContent = r.error || ''; draw(r); };
    m.append(add);
  }

  let lockNote = '';
  async function lockSection(m) {
    m.append(el('h2', null, 'Lock screen'));
    m.append(el('p', 'muted', 'The lock button in the status bar (or Ctrl+Shift+L) covers every window of this profile with a blank screen and pauses media. With no password, one click unlocks it. A password keeps casual onlookers out; it does not encrypt your data on disk. It is kept on this computer only and is never synced.'));
    const has = await browser.lockHas();
    if (has === 'profile') { m.append(el('p', 'muted', 'This profile has a password, so the lock screen asks for that one. Change it from the Profiles page.')); return; }
    const box = el('div'); box.style.cssText = 'display:flex;flex-direction:column;gap:8px;max-width:340px;margin:8px 0 16px';
    const cur = el('input'); cur.type = 'password'; cur.placeholder = 'Current password'; cur.style.display = has ? '' : 'none';
    const nw = el('input'); nw.type = 'password'; nw.placeholder = has ? 'New password (leave empty to remove)' : 'Choose a lock password';
    const go = el('button', null, has ? 'Change or remove password' : 'Set password');
    const msg = el('p', 'muted', lockNote); lockNote = '';
    go.onclick = async () => {
      if (!has && !nw.value) { msg.textContent = 'Type the password you want in the second box first.'; return; }

  // ---- keyboard ----
  function accel(e) {
    if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return null;
    const parts = [];
    if (e.ctrlKey) parts.push('Ctrl');
    if (e.altKey) parts.push('Alt');
    if (e.shiftKey) parts.push('Shift');
    if (e.metaKey) parts.push('Meta');
    let name = e.key.length === 1 ? e.key.toUpperCase() : e.key.replace('Arrow', '');
    if (e.key === ' ') name = 'Space';
    parts.push(name);
    return parts.join('+');
  }
  async function keyboardSection(m) {
    m.append(el('p', 'muted', 'Click “Change”, then press the new key combination. Escape cancels. Shortcuts need Ctrl, Alt or a function key.'));
    const cmds = await browser.getCommands();

    for (const c of cmds) {
      const tr = el('tr');
      const keys = el('td');
      if (c.keys.length) c.keys.forEach((k) => { keys.append(el('kbd', null, k), document.createTextNode(' ')); });
      else keys.append(el('span', 'muted', 'none'));
      const act = el('td');
      act.style.textAlign = 'right';
      const change = el('button', null, 'Change');
      change.onclick = () => {
        change.textContent = 'Press keys…';
        const h = async (e) => {
          e.preventDefault(); e.stopPropagation();
          if (e.key === 'Escape') { window.removeEventListener('keydown', h, true); render(); return; }
          const a = accel(e);
          if (!a) return;
          if (!(e.ctrlKey || e.altKey || e.metaKey || /^F\d+$/.test(e.key))) return;
          window.removeEventListener('keydown', h, true);
          await set('keyboard.overrides.' + c.id, a);
          render();
        };
        window.addEventListener('keydown', h, true);
      };
      const clear = el('button', null, 'Clear');
      clear.onclick = async () => { await set('keyboard.overrides.' + c.id, ''); render(); };
      act.append(change, document.createTextNode(' '), clear);
      if (c.custom) {
        const reset = el('button', null, 'Reset');
        reset.onclick = async () => { await set('keyboard.overrides.' + c.id, null); render(); };
        act.append(document.createTextNode(' '), reset);
      }
      tr.append(el('td', null, c.label), keys, act);
      table.append(tr);
    }

    const out = el('div', 'msg'); out.style.gridColumn = '1 / -1';
    const go = el('button', null, S.sync.token ? 'Sign in again' : 'Sign in');
    const outBtn = el('button', 'danger', 'Sign out');
    const btns = el('div', 'btn-row'); btns.style.gridColumn = '1 / -1'; btns.append(go);
    if (S.sync.token) btns.append(outBtn);
    box.append(btns, out);
    go.onclick = async () => {
      out.style.color = ''; out.textContent = 'Signing in…';
      const r = await browser.syncLogin({ username: user.value.trim(), password: pass.value, totp: totp.value.trim(), profile: profSel.style.display === 'none' ? '' : profSel.value });
      if (r.needProfile) {
        profSel.textContent = '';
        for (const p of r.profiles) { const o = el('option', null, p.name); o.value = p.id; profSel.append(o); }
        profSel.style.display = ''; profLabel.style.display = '';
        out.textContent = 'Choose which profile this browser should sync with, then press the button again.';
      } else if (r.error) { out.style.color = '#ff6b6b'; out.textContent = r.error; }
      else { out.style.color = '#4cc38a'; out.textContent = 'Signed in. Profile: ' + r.profile.name; S = await browser.getSettings(); setTimeout(render, 600); }
    };
    outBtn.onclick = async () => { await browser.syncLogout(); render(); };
    m.append(el('h2', null, 'Account'), box);

    // API key: view, copy, or paste a different one
    const kr = el('div', 'row');
    const lab = el('label', null, 'API key'); lab.append(el('span', 'help', 'Created on the server’s web interface (your profile, API keys). Signing in above fills this in for you.'));
    const wrap = el('div'); wrap.style.cssText = 'display:flex;gap:6px;align-items:center';
    const key = el('input'); key.type = 'password'; key.value = S.sync.token || ''; key.style.width = '260px'; key.autocomplete = 'off';
    key.onchange = async () => { await set('sync.token', key.value.trim()); if (!key.value.trim()) await set('sync.account', {}); render(); };
    const show = el('button', null, 'Show'); show.onclick = () => { const on = key.type === 'password'; key.type = on ? 'text' : 'password'; show.textContent = on ? 'Hide' : 'Show'; };
    const copy = el('button', null, 'Copy');
    copy.onclick = async () => { try { await navigator.clipboard.writeText(key.value); copy.textContent = 'Copied'; } catch { key.type = 'text'; key.select(); copy.textContent = 'Select + Ctrl+C'; } setTimeout(() => { copy.textContent = 'Copy'; }, 2000); };
    wrap.append(key, show, copy);
    kr.append(lab, wrap);
    m.append(kr);
  }

  let flash = '';
  function syncExtras(m) {
    const msg = el('div', 'msg');
    if (flash) { msg.textContent = flash; flash = ''; }
    else browser.syncStatus().then((s) => { msg.textContent = s; });
    const b = el('button', null, 'Sync now');
    b.onclick = async () => {
      if (!S.sync.token) { cur = 'sync'; render(); return; }
      msg.textContent = 'Syncing…'; msg.textContent = await browser.syncNow();
    };
    const test = el('button', null, 'Test connection');
    const out = el('div', 'msg'); out.style.whiteSpace = 'pre-wrap'; out.style.marginTop = '10px';
    test.onclick = async () => {
      out.textContent = 'Testing…'; out.style.color = '';
      const lines = await browser.syncTest();
      out.textContent = lines.join('\n');
      out.style.color = lines.some((l) => l.startsWith('PROBLEM')) ? '#ff6b6b' : '#4cc38a';
    };
    const row = el('div', 'btn-row');
    row.append(b, test);
    m.append(row, msg, out);
  }

  async function blockerSection(m) {
    m.append(el('h2', null, 'Filter lists'));
    const statusEl = el('div', 'msg'); statusEl.style.marginBottom = '10px';
    statusEl.textContent = await browser.blockerStatus();
    const updBtn = el('button', null, 'Update filter lists now');
    const updMsg = el('div', 'msg'); updMsg.style.marginTop = '8px';
    updBtn.onclick = async () => {
      updBtn.disabled = true; updBtn.textContent = 'Downloading…'; updMsg.textContent = '';
      updMsg.textContent = await browser.blockerUpdate();
      statusEl.textContent = await browser.blockerStatus();
      updBtn.disabled = false; updBtn.textContent = 'Update filter lists now';
    };
    m.append(statusEl, updBtn, updMsg);
  }

  const ICONS = [['classic', 'Classic'], ['color', 'Logo (colour)'], ['blue', 'Logo (blue)'], ['white', 'Logo (white)'], ['blue-m', 'M (blue)'], ['white-m', 'M (white)']];
  let iconNote = '';
  function iconSection(m) {
    m.append(el('h2', null, 'Program icon'));
    if (iconNote) { const n = el('p', null, iconNote); n.style.color = '#4cc38a'; m.append(n); }
    const grid = el('div', 'themes');
    for (const [id, name] of ICONS) {
      const c = el('div', 'tcard' + (S.appearance.icon === id ? ' on' : ''));
      const pv = el('div', 'tprev'); pv.style.background = '#1e1f22'; pv.style.display = 'grid'; pv.style.placeItems = 'center';
      const img = el('img'); img.src = 'my://assets/icon/' + id + '.png'; img.style.cssText = 'width:44px;height:44px;object-fit:contain';
      pv.append(img); c.append(pv, el('div', 'tname', name));
      c.onclick = async () => {
        await set('appearance.icon', id);
        const r = await browser.applyIcon(id);
        iconNote = r.window ? 'Window icon changed.' : 'The window icon could not be changed on this system.';
        if (r.launcher === 'updated') iconNote += ' The Linux launcher icon was updated too; it shows after you restart mbrowser (sometimes after logging out and in).';
        else if (r.launcher === 'no-launcher') iconNote += ' To change the taskbar icon on Linux run: sh install-linux.sh ' + id;
        render();
      };
      grid.append(c);
    }
    m.append(grid);
    m.append(el('p', 'muted', 'Changes the window and taskbar icon. The transparent versions suit dark taskbars. On Linux the launcher entry keeps the icon it was installed with: run  sh install-linux.sh white-m  (or another name) to change it. The Windows installer keeps the classic icon.'));
  }

  const THEME_KEYS = [['bg', 'Background'], ['tab', 'Tabs'], ['active', 'Active / toolbar'], ['fg', 'Text'], ['muted', 'Muted text'], ['line', 'Borders'], ['accent', 'Accent']];

  async function themeSection(m) {
    const info = await browser.getThemes();
    const cur_id = S.appearance.themeId;
    m.append(el('h2', null, 'Theme'));
    const grid = el('div', 'themes');
    const card = (t, label) => {
      const c = el('div', 'tcard' + (cur_id === t.id ? ' on' : ''));
      const pv = el('div', 'tprev'); pv.style.background = t.bg;
      const a = el('i'); a.style.background = t.active;
      const b = el('b'); b.style.background = t.tab;
      const u = el('u'); u.style.background = t.accent;
      pv.append(a, b, u);
      c.append(pv, el('div', 'tname', label || t.name));
      c.onclick = async () => { await set('appearance.themeId', t.id); render(); };
      return c;
    };
    info.presets.forEach((t) => grid.append(card(t)));
    info.custom.forEach((t) => grid.append(card(t, t.name + ' ✎')));
    const sys = card({ id: 'system', bg: '#808080', tab: '#a0a0a0', active: '#c0c0c0', accent: '#3b82f6' }, 'Follow system');
    grid.append(sys);
    m.append(grid);

    const row = el('div', 'btn-row');
    const mk = el('button', null, '+ New custom theme');
    mk.onclick = async () => {
      const base = [...info.presets, ...info.custom].find((t) => t.id === cur_id) || info.presets[0];
      const t = { ...base, id: 'custom-' + Date.now(), name: 'My theme' };
      await set('appearance.customThemes', [...info.custom, t]);
      await set('appearance.themeId', t.id);
      render();
    };
    row.append(mk);
    m.append(row);

    const ct = info.custom.find((t) => t.id === cur_id);
    if (ct) {
      const ed = el('div', 'editor');
      const save = async () => { await set('appearance.customThemes', info.custom); };
      ed.append(el('label', null, 'Name'));
      const nm = el('input'); nm.type = 'text'; nm.value = ct.name; nm.onchange = async () => { ct.name = nm.value.trim() || 'My theme'; await save(); render(); };
      ed.append(nm);
      ed.append(el('label', null, 'Dark theme'));
      const dk = el('input'); dk.type = 'checkbox'; dk.checked = !!ct.dark; dk.onchange = async () => { ct.dark = dk.checked; await save(); };
      ed.append(dk);
      for (const [k, name] of THEME_KEYS) {
        ed.append(el('label', null, name));
        const c = el('input'); c.type = 'color'; c.value = ct[k];
        c.onchange = async () => { ct[k] = c.value; await save(); $('themecss').href = 'my://assets/theme.css?' + Date.now(); };
        ed.append(c);
      }
      const del = el('button', 'danger', 'Delete this theme');
      del.onclick = async () => { await set('appearance.customThemes', info.custom.filter((t) => t.id !== ct.id)); await set('appearance.themeId', 'mbrowser'); render(); };
      ed.append(el('span'), del);
      m.append(ed);
    }

    // accent colour override
    const r = el('div', 'row');
    const lab = el('label', null, 'Accent colour');
    lab.append(el('span', 'help', 'Overrides the theme’s accent. Reset to use the theme’s own.'));
    const col = el('input'); col.type = 'color';
    const th = [...info.presets, ...info.custom].find((t) => t.id === cur_id);
    col.value = S.appearance.accentOverride || (th ? th.accent : '#5b8cff');
    col.onchange = async () => { await set('appearance.accentOverride', col.value); render(); };
    const rs = el('button', null, 'Reset');
    rs.onclick = async () => { await set('appearance.accentOverride', ''); render(); };
    const box = el('div'); box.style.display = 'flex'; box.style.gap = '8px'; box.append(col, rs);
    r.append(lab, box);
    m.append(r);
  }

  function renderSearchResults(m) {
    const q = searchQuery.trim().toLowerCase();
    m.append(el('h1', null, 'Search results'));
    let found = 0;
    for (const [catId, catName] of CATS) {
      const all = (FIELDS[catId] || []).filter((d) => !d.beta || S.general.beta);
      if (!all.length) continue;
      const matches = catName.toLowerCase().includes(q)
        ? all
        : all.filter((f) => f.label.toLowerCase().includes(q) || (f.help || '').toLowerCase().includes(q));
      if (!matches.length) continue;
      m.append(el('h2', null, catName));
      matches.forEach((d) => m.append(field(d)));
      found += matches.length;
    }
    if (!found) {
      const p = el('p', 'muted', 'No settings match "' + searchQuery.trim() + '".');
      m.append(p);
    }
  }

  async function render() {
    S = await browser.getSettings();
    if (cur === 'extensions' && !S.general.beta) cur = 'general';
    const nav = $('nav');
    nav.querySelectorAll('button').forEach((b) => b.remove());
    for (const [id, name] of CATS) {
      if (id === 'server' && !S.sync.server) continue;
      if (id === 'extensions' && !S.general.beta) continue;
      const active = !searchQuery && id === cur;
      const b = el('button', (active ? 'on' : '') + (BETA_CATS.has(id) ? ' beta' : ''), name);
      b.onclick = () => { cur = id; searchQuery = ''; $('settings-search').value = ''; location.hash = id; render(); };
      nav.append(b);
    }
    const m = $('main');
    m.style.cssText = '';
    m.textContent = '';
    if (searchQuery.trim()) { renderSearchResults(m); return; }
    if (cur !== 'server' && cur !== 'import' && cur !== 'profiles') m.append(el('h1', null, CATS.find((c) => c[0] === cur)[1]));

    if (cur === 'search') { searchSection(m); return; }
    if (cur === 'extensions') { await extensionsSection(m); return; }
    if (cur === 'homenet') { await homenetSection(m); return; }
    if (cur === 'keyboard') { await keyboardSection(m); return; }
    if (cur === 'about') {
      const build = await browser.appBuildNumber();
      const vers = await browser.appVersions().catch(() => ({}));
      const logo = document.createElement('img');
      logo.src = 'my://assets/icon/color.png';
      logo.style.cssText = 'width:64px;height:64px;border-radius:16px;display:block;margin:0 0 16px;';
      m.append(logo);
      const title = el('h2', null, 'mbrowser');
      title.style.cssText = 'font-size:24px;margin:0 0 4px;font-weight:700;';
      m.append(title);
      const verLine = el('p', 'muted', `Version 0.9.0 Build ${build > 0 ? build : 'dev'} · Electron ${vers.electron || '?'} · Chromium ${vers.chrome || '?'}`);
      verLine.style.marginBottom = '16px';
      m.append(verLine);
      const tagline = el('p', null, 'A Chromium-based browser with self-hosted sync. Your data, your server.');
      tagline.style.marginBottom = '16px';
      m.append(tagline);
      const ghLink = document.createElement('a');
      ghLink.href = 'https://github.com/flesheatingbug/mbrowser';
      ghLink.textContent = 'github.com/flesheatingbug/mbrowser →';
      ghLink.onclick = (e) => { e.preventDefault(); browser.openUrl(ghLink.href, 'tab'); };
      ghLink.style.cssText = 'font-size:14px;';
      m.append(ghLink);

      const sep = el('div'); sep.style.cssText = 'border-top:1px solid var(--line);margin:24px 0;';
      m.append(sep);

      const updateRow = el('div', 'btn-row'); updateRow.style.alignItems = 'center';
      const checkBtn = el('button', null, 'Check for updates');
      const updateMsg = el('span', 'msg', '');
      updateRow.append(checkBtn, updateMsg);
      m.append(updateRow);

      let pendingInfo = null;
      checkBtn.onclick = async () => {
        checkBtn.disabled = true; checkBtn.textContent = 'Checking…';
        updateMsg.textContent = ''; pendingInfo = null;
        const installBtn = updateRow.querySelector('.install-btn');
        if (installBtn) installBtn.remove();
        const info = await browser.appUpdateInfo();
        checkBtn.disabled = false; checkBtn.textContent = 'Check for updates';
        if (info.error) { updateMsg.textContent = 'Error: ' + info.error; return; }
        if (info.upToDate) { updateMsg.textContent = `You’re up to date (build ${info.build}).`; return; }
        updateMsg.textContent = `Build ${info.build} is available.`;
        pendingInfo = info;
        const ib = el('button', 'install-btn', info.canInstall ? 'Update now' : 'See release changes');
        ib.onclick = async () => {
          ib.disabled = true;
          if (info.canInstall) {
            ib.textContent = 'Downloading… 0%';
            browser.onDlProgress((pct) => { ib.textContent = 'Downloading… ' + Math.round(pct * 100) + '%'; });
            await browser.appAutoInstall(pendingInfo);
            browser.offDlProgress();
            ib.textContent = 'Installing…';
          } else {
            const releaseUrl = info.releaseUrl || 'https://github.com/flesheatingbug/mbrowser/releases/tag/latest-desktop';
            browser.openUrl(releaseUrl, 'tab');
            ib.disabled = false; ib.textContent = 'See release changes';
          }
        };
        updateRow.append(ib);
      };

      const uaSep = el('div'); uaSep.style.cssText = 'border-top:1px solid var(--line);margin:24px 0;';
      m.append(uaSep);
      m.append(el('p', 'muted', navigator.userAgent));
      return;
    }
    if (cur === 'appearance') { await themeSection(m); toolbarSection(m); iconSection(m); }
    if (cur === 'import' || cur === 'profiles' || cur === 'passwords') {
      const frame = document.createElement('iframe');
      frame.src = cur === 'passwords' ? 'my://passwords' : ('my://' + cur);
      if (cur === 'passwords') {
        m.style.cssText = 'max-width:none;padding:32px 48px 0;';
        frame.style.cssText = 'width:100%;height:calc(100vh - 74px);border:0;display:block;';
      } else {
        frame.style.cssText = 'width:100%;height:calc(100vh - 20px);border:0;display:block';
        m.style.padding = '0';
      }
      m.append(frame);
      return;
    }
    if (cur === 'server') {
      m.style.cssText = 'padding:0;max-width:none;display:flex;flex-direction:column;flex:1;height:100vh;';
      m.textContent = '';
      const serverUrl = S.sync.server ? S.sync.server.replace(/\/$/, '') : '';
      if (!serverUrl) {
        m.style.cssText = '';
        m.append(el('h1', null, 'Server Admin'));
        m.append(el('p', 'muted', 'No server configured. Set up a server address in Sync settings first.'));
        const btn = el('button'); btn.textContent = 'Go to Sync settings';
        btn.onclick = () => { cur = 'sync'; render(); };
        m.append(btn);
      } else {
        // slim header bar
        const bar = el('div'); bar.style.cssText = 'display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--tab);border-bottom:1px solid var(--line);flex:none;height:38px;';
        const dot = el('span'); dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;';
        const urlLbl = el('code'); urlLbl.style.cssText = 'flex:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
        urlLbl.textContent = serverUrl;
        const reloadBtn = el('button'); reloadBtn.textContent = '↻ Reload'; reloadBtn.style.cssText = 'padding:2px 10px;font-size:12px;';
        const popBtn = el('button'); popBtn.textContent = '⬡ Open in tab'; popBtn.style.cssText = 'padding:2px 10px;font-size:12px;';
        popBtn.onclick = () => browser.openUrl(serverUrl, 'tab');
        bar.append(dot, urlLbl, reloadBtn, popBtn);
        // webview fills the rest — iframe can't load http:// from a my:// origin
        const frame = document.createElement('webview');
        frame.style.cssText = 'flex:1;border:0;width:100%;';
        frame.setAttribute('src', serverUrl);
        frame.addEventListener('dom-ready', () => { dot.style.background = '#4cc38a'; });
        frame.addEventListener('did-fail-load', (_e) => { dot.style.background = '#e5534b'; });
        reloadBtn.onclick = () => { try { frame.reload(); } catch { frame.setAttribute('src', serverUrl); } };
        m.append(bar, frame);
        // ping for dot colour
        browser.invoke('server:ping', serverUrl).then((r) => {
          dot.style.background = r && r.ok ? '#4cc38a' : '#e8a33d';
        }).catch(() => { dot.style.background = '#e5534b'; });
      }
      return;
    }
    if (cur === 'general') {
      const st = await browser.defaultStatus().catch(() => null);
      if (st && st.supported) {
        const row = el('div', 'btn-row'); row.style.cssText = 'align-items:center;margin-bottom:18px;';
        const label = el('span', null, st.isDefault ? 'mbrowser is your default browser.' : 'mbrowser is not your default browser.');
        const btn = el('button', null, 'Make default browser');
        if (st.isDefault) btn.style.display = 'none';
        const note = el('span', 'msg', '');
        btn.onclick = async () => {
          const r = await browser.defaultSet().catch(() => null);
          if (/linux/i.test(navigator.userAgent)) {
            note.textContent = r && r.ok ? 'Done. If your desktop still shows another browser, pick mbrowser under Default applications.' : 'Could not set it automatically. Pick mbrowser under Default applications in your system settings.';
            if (r && r.ok) { btn.style.display = 'none'; label.textContent = 'mbrowser is your default browser.'; }
          } else note.textContent = 'Windows opened Default apps. Choose mbrowser under Web browser.';
        };
        row.append(label, btn, note);
        m.append(row);
      }
    }
    if (cur === 'sync') { const ci = await browser.cloudInfo(); await backendPicker(m, ci); if (ci.backend === 'server') syncAuthSection(m); else cloudSection(m, ci); }
    (FIELDS[cur] || []).forEach((d) => { if (d.beta && !S.general.beta) return; m.append(field(d)); });
    if (cur === 'privacy') await lockSection(m);
    if (cur === 'startpage') m.append(el('p', 'muted', 'Add, edit, group and reorder speed dials on the start page itself. Drag a tile to reorder it, or drop it on a group tab to move it.'));
    if (cur === 'privacy') clearButtons(m);
    if (cur === 'adblocker') await blockerSection(m);
    if (cur === 'sync') {
      syncExtras(m);
      if (S.sync.server && (S.sync.backend || 'server') === 'server') {
        const adminLink = el('div'); adminLink.style.marginTop = '18px';
        const a = el('a', null, 'Server Admin →'); a.href = '#'; a.style.fontSize = '14px';
        a.onclick = (e) => { e.preventDefault(); cur = 'server'; render(); };
        adminLink.append(a);
        m.append(adminLink);
      }
    }
  }
  if (!CATS.some((c) => c[0] === cur)) cur = 'general';
  $('settings-search').addEventListener('input', () => {
    searchQuery = $('settings-search').value;
    render();
  });
  render();
</script>
</body>
</html>
