<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Downloads</title>
<link rel="stylesheet" href="my://assets/theme.css">
<link rel="stylesheet" href="my://assets/common.css">
<style>
  .item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
  .item:last-child { border-bottom:none; }
  .info { flex:1; min-width:0; }
  .info .name { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .info .sub { font-size:12px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .info progress { width:100%; height:5px; accent-color:var(--accent); display:block; margin-top:5px; }
  .btns { display:flex; gap:4px; flex:none; padding-top:1px; }
  .btns button { padding:3px 10px; font-size:12px; }
  .ctx { position:fixed; background:var(--active); border:1px solid var(--line); border-radius:8px; padding:4px 0; z-index:999; min-width:200px; box-shadow:0 4px 16px rgba(0,0,0,.35); display:none; }
  .ctx-item { padding:7px 14px; cursor:pointer; font-size:13px; }
  .ctx-item:hover { background:var(--tab); }
  .ctx-sep { height:1px; background:var(--line); margin:4px 0; }
  .ctx-danger { color:#e5534b; }
  #top { display:flex; align-items:center; margin-bottom:16px; }
  #top h1 { margin:0; flex:1; }
</style>
</head>
<body>
<div class="wrap">
  <div id="top">
    <h1>Downloads</h1>
    <button id="clear-all" class="danger" style="display:none">Clear finished</button>
  </div>
  <ul class="plain" id="list"></ul>
</div>
<div class="ctx" id="ctx"></div>
<script>
  const fmt = (n) => n > 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : n > 1e3 ? Math.round(n / 1e3) + ' KB' : n + ' B';

  const ctx = document.getElementById('ctx');

  function showCtx(e, d) {
    e.preventDefault();
    ctx.textContent = '';
    const item = (label, fn, danger) => {
      const el = document.createElement('div');
      el.className = 'ctx-item' + (danger ? ' ctx-danger' : '');
      el.textContent = label;
      el.onclick = () => { hideCtx(); fn(); };
      ctx.append(el);
    };
    const sep = () => { const s = document.createElement('div'); s.className = 'ctx-sep'; ctx.append(s); };
    const active = d.state === 'progressing' || d.state === 'paused';
    if (d.state === 'completed') {
      item('Open', () => browser.downloadAction(d.id, 'open'));
      item('Show in file manager', () => browser.downloadAction(d.id, 'show'));
      sep();
    }
    item('Copy download address', () => browser.downloadAction(d.id, 'copyUrl'));
    if (d.path) item('Copy local path', () => browser.downloadAction(d.id, 'copyPath'));
    if (active) {
      sep();
      if (d.state === 'progressing') item('Pause', () => { browser.downloadAction(d.id, 'pause'); tick(); });
      if (d.state === 'paused') item('Resume', () => { browser.downloadAction(d.id, 'resume'); tick(); });
      item('Cancel', () => { browser.downloadAction(d.id, 'cancel'); tick(); }, true);
    }
    if (d.state !== 'progressing') {
      sep();
      item('Restart download', () => browser.downloadAction(d.id, 'restart'));
    }
    sep();
    item('Remove from list', () => { browser.downloadAction(d.id, 'remove'); tick(); }, true);
    item('Remove all', () => { browser.downloadAction(null, 'removeAll'); tick(); }, true);

    ctx.style.display = 'block';
    const h = ctx.offsetHeight;
    const x = Math.min(e.clientX, window.innerWidth - 210);
    const y = e.clientY + h > window.innerHeight ? e.clientY - h : e.clientY;
    ctx.style.left = x + 'px';
    ctx.style.top = y + 'px';
  }

  function hideCtx() { ctx.style.display = 'none'; }
  document.addEventListener('click', hideCtx);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCtx(); });

  async function tick() {
    const list = document.getElementById('list');
    const ds = await browser.getDownloads();
    const hasFinished = ds.some((d) => d.state !== 'progressing' && d.state !== 'paused');
    document.getElementById('clear-all').style.display = hasFinished ? '' : 'none';
    list.textContent = '';
    if (!ds.length) { list.innerHTML = '<li class="muted">No downloads yet.</li>'; return; }
    for (const d of ds) {
      const li = document.createElement('li');
      li.oncontextmenu = (e) => showCtx(e, d);

      const info = document.createElement('div'); info.className = 'info';
      const name = document.createElement('div'); name.className = 'name'; name.textContent = d.name;
      const sub = document.createElement('div'); sub.className = 'sub';
      const active = d.state === 'progressing' || d.state === 'paused';
      sub.textContent = active
        ? `${fmt(d.received)} / ${d.total ? fmt(d.total) : '?'}${d.state === 'paused' ? ' (paused)' : ''}`
        : d.state === 'completed' ? 'Completed \xb7 ' + d.path : d.state;
      info.append(name, sub);
      if (active && d.total) { const p = document.createElement('progress'); p.max = d.total; p.value = d.received; info.append(p); }

      const btns = document.createElement('div'); btns.className = 'btns';
      const btn = (t, act, cls) => {
        const b = document.createElement('button');
        b.textContent = t;
        if (cls) b.className = cls;
        b.onclick = async (ev) => { ev.stopPropagation(); await browser.downloadAction(d.id, act); tick(); };
        btns.append(b);
      };
      if (d.state === 'completed') { btn('Open', 'open'); btn('Show', 'show'); }
      if (active) {
        btn(d.state === 'paused' ? 'Resume' : 'Pause', d.state === 'paused' ? 'resume' : 'pause');
        btn('Cancel', 'cancel', 'danger');
      }
      btn('Remove', 'remove', 'danger');

      li.append(info, btns);
      list.appendChild(li);
    }
  }

  document.getElementById('clear-all').onclick = async () => { await browser.downloadAction(null, 'removeAll'); tick(); };

  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
