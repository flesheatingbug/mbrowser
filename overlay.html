<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src https: http: data:">
<style>
/* slim themed scrollbars */
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--muted, #888) 38%, transparent); border-radius:10px; border:3px solid transparent; background-clip:content-box; min-height:36px; }
  ::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--accent, #7aa2f7) 70%, transparent); background-clip:content-box; }
  ::-webkit-scrollbar-corner { background:transparent; }
  
  :root { --bg:#1e1f22; --tab:#2b2d31; --active:#3a3d44; --fg:#e6e6e6; --muted:#9aa0a6; --line:#34363b; --accent:#7aa2f7; }
  * { box-sizing: border-box; }
  #auth-card { position:absolute; left:50%; top:80px; transform:translateX(-50%); width:320px; box-sizing:border-box; padding:20px; border-radius:14px; background:var(--bg); color:var(--fg); border:1px solid var(--line); box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #auth-card h3 { margin:0 0 10px; font-size:16px; font-weight:600; }
  #auth-site { font-size:13px; word-break:break-all; } #auth-note { font-size:12px; color:var(--muted); margin:2px 0 14px; }
  #auth-card label { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:10px; }
  #auth-card input { width:190px; box-sizing:border-box; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--fg); font:inherit; outline:none; }
  #auth-card input:focus { border-color:var(--accent); }
  #auth-card .row { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  #auth-card button { border:0; border-radius:18px; padding:8px 18px; font:inherit; font-size:13px; cursor:pointer; background:var(--tab); color:var(--fg); }
  #auth-card #auth-ok { background:var(--accent); color:var(--onaccent); }
  .dz-half { position:absolute; top:0; bottom:0; width:50%; box-sizing:border-box; display:flex; align-items:center; justify-content:center; color:var(--fg); font-weight:600; transition:background .1s, border-color .1s; border:2px solid transparent; border-radius:8px; margin:6px; width:calc(50% - 12px); }
  #dz-l { left:0; } #dz-r { right:0; }
  .dz-half span { opacity:0; padding:8px 14px; border-radius:8px; background:var(--bg); }
  .dz-half.on { background:color-mix(in srgb, var(--accent) 28%, transparent); border-color:var(--accent); }
  .dz-half.on span { opacity:1; }
  html, body { margin:0; height:100%; background:transparent; color:var(--fg); font:14px system-ui, sans-serif; overflow:hidden; }
  .card { height:100%; background:var(--active); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.45); display:flex; flex-direction:column; overflow:hidden; }
  input { width:100%; border:0; outline:0; background:transparent; color:var(--fg); font:inherit; }
  #palette, #find { display:none; height:100%; flex-direction:column; }
  #palette input { padding:14px 16px; font-size:16px; border-bottom:1px solid var(--line); }
  #list { flex:1; overflow-y:auto; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:8px 16px; cursor:default; }
  .row.sel { background:var(--accent); color:var(--onaccent); }
  .row .l { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .row .d { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:50%; }
  .row.sel .d { color:var(--onaccent); opacity:.75; }
  #find { flex-direction:row; align-items:center; gap:6px; padding:0 10px; }
  #find input { flex:1; padding:6px 4px; }
  #find button { background:none; border:0; color:var(--fg); cursor:pointer; font-size:15px; width:28px; height:28px; border-radius:6px; }
  #find button:hover { background:var(--tab); }
  #count { color:var(--muted); font-size:12px; min-width:48px; text-align:right; }
  #pw { display:none; }
  #pw .pbox { padding:16px 18px; }
  #pw h2 { margin:0 0 2px; font-size:15px; }
  #pw .sub { color:var(--muted); font-size:12px; margin-bottom:10px; word-break:break-all; }
  #pw p { margin:6px 0; font-size:12px; color:var(--muted); line-height:1.45; }
  #pw input { width:100%; padding:8px 10px; margin:4px 0; background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  #pw input:focus { border-color:var(--accent); }
  #pw .btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  #pw button { background:var(--tab); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; }
  #pw button:hover { border-color:var(--accent); }
  #pw button.primary { background:var(--accent); color:var(--onaccent); border-color:var(--accent); }
  #pw .err { color:#ff6b6b; font-size:12px; min-height:16px; margin-top:4px; }
  #pw .frow { display:flex; align-items:center; gap:10px; height:40px; padding:0 14px; cursor:default; }
  #pw .frow:hover { background:var(--tab); }
  #pw .frow .ic { width:20px; text-align:center; }
  #pw .frow .l { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #pw .frow.muted .l { color:var(--muted); font-size:12px; }
  #pw .frow-del { display:none; width:22px; text-align:center; cursor:pointer; color:var(--muted); flex:none; border-radius:4px; font-size:15px; line-height:40px; }
  #pw .frow:hover .frow-del { display:block; }
  #pw .frow-del:hover { color:#e5534b; }
  #tablist { display:none; height:100%; flex-direction:column; }
  #tablist input { padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; }
  #tl-body { flex:1; overflow-y:auto; padding-bottom:6px; }
  #tl-body h4 { margin:10px 14px 4px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .trow { display:flex; align-items:center; gap:10px; padding:0 8px 0 14px; height:38px; cursor:default; }
  .trow:hover { background:var(--tab); }
  .trow.active { box-shadow:inset 3px 0 0 var(--accent); }
  .trow .fi { width:16px; height:16px; flex:none; border-radius:3px; background:var(--line); display:grid; place-items:center; font-size:10px; color:var(--muted); object-fit:cover; }
  .trow .tx { flex:1; min-width:0; }
  .trow .tx b { display:block; font-weight:400; font-size:13px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .trow .tx small { display:block; color:var(--muted); font-size:11px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .trow .win { font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:0 5px; }
  .trow .x { background:none; border:0; color:var(--muted); cursor:pointer; font-size:14px; width:24px; height:24px; border-radius:6px; }
  .trow .x:hover { background:var(--line); color:var(--fg); }
  .tempty { color:var(--muted); font-size:12px; padding:6px 14px; }
  #suggest { display:none; padding:6px 0; }
  #suggest .srow { display:flex; align-items:center; gap:10px; padding:0 14px; height:36px; cursor:default; }
  #suggest .srow.sel { background:var(--accent); color:var(--onaccent); }
  #suggest .ic { width:18px; text-align:center; flex:none; }
  #suggest .l { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #suggest .d { color:var(--muted); font-size:12px; max-width:45%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #suggest .x { flex:none; width:22px; height:22px; border-radius:11px; display:none; place-items:center; font-size:16px; opacity:.7; }
  #suggest .srow:hover .x, #suggest .srow.sel .x { display:grid; }
  #suggest .x:hover { background:rgba(128,128,128,.35); opacity:1; }
  #suggest .srow.sel .d { color:var(--onaccent); opacity:.75; }
  #security { display:none; padding:16px 18px; overflow-y:auto; height:100%; }
  #security h2 { font-size:15px; margin:0 0 4px; }
  #security .host { color:var(--muted); font-size:12px; word-break:break-all; margin-bottom:12px; }
  #security .kv { display:grid; grid-template-columns:90px 1fr; gap:4px 10px; font-size:12px; margin:6px 0; }
  #security .kv span:nth-child(odd) { color:var(--muted); }
  #security .kv span:nth-child(even) { word-break:break-all; }
  #security hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
  #security .warn { color:#e8a33d; font-size:13px; margin:6px 0; }
  #security button { background:var(--tab); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; margin-top:6px; }
  #security button:hover { border-color:var(--accent); }
  #card-fill, #addr-fill { display:none; padding:6px 0; }
  .frow2 { display:flex; align-items:center; gap:10px; padding:0 14px; height:40px; cursor:default; }
  .frow2:hover { background:var(--tab); }
  .frow2 .ic2 { font-size:16px; width:22px; text-align:center; }
  .frow2 .l2 { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  .frow2 .d2 { font-size:11px; color:var(--muted); }
  .frow2.hdr2 { cursor:default; height:34px; border-bottom:1px solid var(--line); padding-bottom:4px; }
  .frow2.hdr2 .l2 { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  #bm-popup { font-size:13px; }
  #bm-popup .bm-title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:14px; font-size:14px; }
  #bm-popup label { display:block; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; margin-top:4px; }
  #bm-popup select, #bm-popup input[type=text] { width:100%; background:var(--tab); border:1px solid var(--line); border-radius:7px; color:var(--fg); padding:6px 10px; font-size:13px; outline:none; font-family:inherit; }
  #bm-popup select:focus, #bm-popup input:focus { border-color:var(--accent); }
  #bm-popup { outline:none; }
  #bm-popup .bm-folders { max-height:132px; overflow-y:auto; border:1px solid var(--line); border-radius:7px; background:var(--tab); padding:3px; }
  #bm-popup .bm-f { padding:7px 10px; margin:1px 0; border-radius:5px; cursor:pointer; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bm-popup .bm-f:hover { background:rgba(128,128,128,.18); }
  #bm-popup .bm-f.sel { background:var(--accent); color:var(--onaccent); }
  #bm-popup .bm-row { display:flex; gap:8px; margin-top:16px; }
  #bm-popup .bm-row button { flex:1; padding:9px 10px; font-size:12px; border-radius:7px; border:none; cursor:pointer; font-family:inherit; background:var(--tab); color:var(--fg); border:1px solid var(--line); }
  #bm-popup .bm-row button:hover { border-color:var(--muted); }
  #bm-popup .bm-row button.primary { background:var(--accent); color:var(--onaccent); border-color:transparent; }
  #bm-popup .bm-row button.danger { color:#ff6b6b; }
  #bm-popup .bm-added { font-size:12px; color:var(--muted); margin-top:10px; min-height:0; }
  #bm-popup .bm-added:empty { display:none; }
</style>
</head>
<body>
<div class="card">
  <div id="palette">
    <input id="q" placeholder="Quick commands: search tabs, bookmarks, history, commands…" spellcheck="false">
    <div id="list"></div>
  </div>
  <div id="pw"></div>
  <div id="tablist">
    <input id="tlq" placeholder="Search open and recently closed tabs…" spellcheck="false">
    <div id="tl-body"></div>
  </div>
  <div id="suggest"></div>
  <div id="security"></div>
  <div id="find">
    <input id="f" placeholder="Find in page" spellcheck="false">
    <span id="count"></span>
    <button id="prev" title="Previous (Shift+Enter)">▲</button>
    <button id="next" title="Next (Enter)">▼</button>
    <button id="close" title="Close (Esc)">×</button>
  </div>
  <div id="card-fill"></div>
  <div id="addr-fill"></div>
  <div id="bm-popup" style="display:none;padding:14px 16px"></div>
  <div id="auth" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,.45)">
    <form id="auth-card" autocomplete="off">
      <h3>Sign in</h3>
      <div id="auth-site"></div>
      <div id="auth-note"></div>
      <label>Username<input id="auth-u" spellcheck="false" autocomplete="off"></label>
      <label>Password<input id="auth-p" type="password" autocomplete="off"></label>
      <div class="row"><button type="button" id="auth-cancel">Cancel</button><button type="submit" id="auth-ok">Sign in</button></div>
    </form>
  </div>
  <div id="dz" style="display:none;position:absolute;inset:0">
    <div id="dz-l" class="dz-half"><span>Drop to place on the left</span></div>
    <div id="dz-r" class="dz-half"><span>Drop to place on the right</span></div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let mode = null, items = [], sel = 0, seq = 0, lastText = '';

  api.onState((s) => {
    const root = document.documentElement.style;
    for (const [k, v] of Object.entries(s.theme)) if (typeof v === 'string') root.setProperty('--' + k, v);
  });

  api.onOverlayOpen((m, data) => {
    mode = m;
    $('palette').style.display = m === 'palette' ? 'flex' : 'none';
    $('find').style.display = m === 'find' ? 'flex' : 'none';
    $('security').style.display = m === 'security' ? 'block' : 'none';
    $('suggest').style.display = m === 'suggest' ? 'block' : 'none';
    $('tablist').style.display = m === 'tablist' ? 'flex' : 'none';
    $('pw').style.display = m === 'pw' ? 'block' : 'none';
    $('dz').style.display = m === 'dropzone' ? 'block' : 'none';
    $('auth').style.display = m === 'auth' ? 'block' : 'none';
    if (m === 'auth') {
      const d = data || {};
      $('auth-site').textContent = d.site || ''; $('auth-u').value = ''; $('auth-p').value = '';
      $('auth-note').textContent = d.retry ? 'That username or password was not accepted.' : d.secure ? (d.realm ? 'Realm: ' + d.realm : '') : 'Your connection to this site is not private';
      setTimeout(() => $('auth-u').focus(), 0);
      return;
    }
    if (m === 'dropzone') return;
    $('card-fill').style.display = m === 'card' ? 'block' : 'none';
    $('addr-fill').style.display = m === 'addr' ? 'block' : 'none';
    $('bm-popup').style.display = m === 'bookmark' ? 'block' : 'none';
    if (m === 'card') renderFillList('card-fill', data || {}, '💳', (id) => api.invoke('card:pick', id));
    if (m === 'addr') renderFillList('addr-fill', data || {}, '🏠', (id) => api.invoke('addr:pick', id));
    if (m === 'pw') renderPw(data || {});
    if (m === 'tablist') { TL = data || { open: [], closed: [] }; $('tlq').value = ''; renderTabList(); setTimeout(() => $('tlq').focus(), 0); }
    if (m === 'security') renderSecurity(data || {});
    else if (m === 'bookmark') renderBookmark(data || {});
    else if (m === 'palette') { $('q').value = ''; refresh(); setTimeout(() => $('q').focus(), 0); }
    else { $('count').textContent = ''; lastText = ''; setTimeout(() => { $('f').focus(); $('f').select(); if ($('f').value) doFind(true, false); }, 0); }
  });

  // ---- split drop zone: dragging a tab over the page highlights the half where the pane will go ----
  (function () {
    const TAB_MIME = 'application/x-mybrowser-tab';
    const L = $('dz-l'), R = $('dz-r');
    const side = (e) => (e.clientX < innerWidth / 2 ? 'left' : 'right');
    let last = null;
    const mark = (s) => { L.classList.toggle('on', s === 'left'); R.classList.toggle('on', s === 'right'); if (s !== last) { last = s; api.invoke('split:hover', s); } };
    document.addEventListener('dragover', (e) => { if (mode !== 'dropzone' || !e.dataTransfer.types.includes(TAB_MIME)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; mark(side(e)); });
    document.addEventListener('dragleave', (e) => { if (mode === 'dropzone' && !e.relatedTarget && (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= innerWidth - 1 || e.clientY >= innerHeight - 1)) mark(null); });
    document.addEventListener('drop', (e) => {
      if (mode !== 'dropzone') return;
      e.preventDefault();
      const id = Number(e.dataTransfer.getData(TAB_MIME)) || 0;
      mark(null);
      api.invoke('split:drop', id, side(e));
    });
  })();

  // ---- HTTP sign-in dialog ----
  $('auth-card').addEventListener('submit', (e) => { e.preventDefault(); api.authSubmit($('auth-u').value, $('auth-p').value); });
  $('auth-cancel').addEventListener('click', () => api.closeOverlay());
  $('auth-card').addEventListener('keydown', (e) => { if (e.key === 'Escape') api.closeOverlay(); });

  // ---- palette ----
  async function refresh() {
    const my = ++seq;
    const res = await api.paletteQuery($('q').value);
    if (my !== seq) return;
    items = res; sel = 0; render();
  }
  function render() {
    const list = $('list');
    list.textContent = '';
    items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (i === sel ? ' sel' : '');
      const l = document.createElement('span'); l.className = 'l'; l.textContent = it.label;
      const d = document.createElement('span'); d.className = 'd'; d.textContent = it.detail || '';
      row.append(l, d);
      row.onmousedown = (e) => { e.preventDefault(); api.paletteRun(it); };
      list.appendChild(row);
    });
    const cur = list.children[sel];
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  $('q').addEventListener('input', refresh);
  $('q').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); render(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (items[sel]) api.paletteRun(items[sel]); }
    else if (e.key === 'Escape') { api.closeOverlay(); }
  });

  // ---- card / address fill lists ----
  function renderFillList(containerId, data, icon, onPick) {
    const box = $(containerId);
    box.textContent = '';
    const hdr = document.createElement('div');
    hdr.className = 'frow2 hdr2';
    const lbl = document.createElement('span'); lbl.className = 'l2';
    lbl.textContent = icon + '  ' + (containerId === 'card-fill' ? 'Payment cards' : 'Saved addresses');
    hdr.append(lbl);
    box.append(hdr);
    for (const item of (data.items || [])) {
      const row = document.createElement('div');
      row.className = 'frow2';
      const ic = document.createElement('span'); ic.className = 'ic2'; ic.textContent = icon;
      const l = document.createElement('span'); l.className = 'l2';
      l.textContent = item.name || item.fullName || '';
      const d2 = document.createElement('span'); d2.className = 'd2';
      d2.textContent = containerId === 'card-fill' ? (item.lastFour ? '···· ' + item.lastFour : '') : (item.city || item.country || '');
      row.append(ic, l, d2);
      row.onmousedown = (e) => { e.preventDefault(); onPick(item.id); };
      box.append(row);
    }
  }

  // ---- passwords: save bubble, fill list, unlock ----
  function renderPw(d) {
    const box = $('pw');
    box.textContent = '';
    const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

    if (d.view === 'fill') {
      box.onmouseenter = () => api.invoke('pw:popup-enter');
      box.onmouseleave = () => api.invoke('pw:popup-leave');
      if (d.locked) {
        const r = mk('div', 'frow'); r.append(mk('span', 'ic', '🔒'), mk('span', 'l', 'Unlock to fill saved passwords'));
        r.onmousedown = (e) => { e.preventDefault(); api.pwAction({ action: 'unlockPrompt' }); };
        box.append(r);
      }
      for (const it of d.items || []) {
        const r = mk('div', 'frow');
        r.append(mk('span', 'ic', '👤'), mk('span', 'l', (it.name && it.name !== it.username ? it.name + ' · ' : '') + it.username));
        const del = mk('span', 'frow-del', '×'); del.title = 'Delete this login';
        del.onmousedown = (e) => { e.preventDefault(); e.stopPropagation(); api.pwAction({ action: 'deleteEntry', id: it.id }); };
        r.append(del);
        r.onmousedown = (e) => { if (e.target.closest && e.target.closest('.frow-del')) return; e.preventDefault(); api.pwAction({ action: 'fill', id: it.id }); };
        box.append(r);
      }
      if (d.empty) { const e = mk('div', 'frow muted'); e.append(mk('span', 'ic', ''), mk('span', 'l', 'No saved logins for this site')); box.append(e); }
      const m = mk('div', 'frow muted'); m.append(mk('span', 'ic', '🔑'), mk('span', 'l', 'Open password manager…'));
      m.onmousedown = (e) => { e.preventDefault(); api.pwAction({ action: 'manage' }); };
      box.append(m);
      return;
    }

    const b = mk('div', 'pbox'); box.append(b);
    let master = null, confirm = null;
    const err = mk('div', 'err');
    const run = async (payload) => {
      const r = await api.pwAction(payload);
      if (r && r.error) { err.textContent = r.error; }
    };
    const gather = () => ({ master: master ? master.value : '', confirm: confirm ? confirm.value : '' });

    if (d.view === 'save') {
      b.append(mk('h2', '', d.mode === 'update' ? 'Update password?' : 'Save password?'));
      b.append(mk('div', 'sub', (d.username || '(no username)') + ' on ' + d.host));
      if (d.needsCreate) {
        b.append(mk('p', '', 'Create a master password to protect your saved passwords. Any length works, but short ones are easy to guess. It is never stored or sent anywhere; if you forget it, the passwords cannot be recovered.'));
        master = mk('input'); master.type = 'password'; master.placeholder = 'New master password (any length)';
        confirm = mk('input'); confirm.type = 'password'; confirm.placeholder = 'Repeat master password';
        b.append(master, confirm);
      } else if (d.needsUnlock) {
        master = mk('input'); master.type = 'password'; master.placeholder = 'Master password';
        b.append(master);
      }
      b.append(err);
      const btns = mk('div', 'btns');
      const save = mk('button', 'primary', d.mode === 'update' ? 'Update' : 'Save');
      save.onclick = () => run({ action: 'save', ...gather() });
      const later = mk('button', '', 'Not now'); later.onclick = () => api.pwAction({ action: 'dismiss' });
      const never = mk('button', '', 'Never for this site'); never.onclick = () => api.pwAction({ action: 'never' });
      btns.append(save, later, never);
      b.append(btns);
    } else { // unlock
      b.append(mk('h2', '', 'Unlock passwords'));
      b.append(mk('div', 'sub', 'Enter your master password to fill saved logins.'));
      master = mk('input'); master.type = 'password'; master.placeholder = 'Master password';
      const keepRow = mk('label', 'sub'); keepRow.style.cssText = 'display:flex;gap:8px;align-items:center;margin:8px 0';
      const keep = mk('input'); keep.type = 'checkbox'; keep.checked = !!d.keep; keepRow.append(keep, document.createTextNode('Keep passwords unlocked on this computer'));
      b.append(master, keepRow, err);
      const btns = mk('div', 'btns');
      const go = mk('button', 'primary', 'Unlock'); go.onclick = () => run({ action: 'unlock', master: master.value, after: d.after, keep: keep.checked });
      const no = mk('button', '', 'Cancel'); no.onclick = () => api.pwAction({ action: 'dismiss' });
      btns.append(go, no); b.append(btns);
    }
    const submit = () => (d.view === 'save' ? b.querySelector('.primary').click() : b.querySelector('.primary').click());
    for (const inp of b.querySelectorAll('input')) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); else if (e.key === 'Escape') api.pwAction({ action: 'dismiss' }); });
    if (master) setTimeout(() => master.focus(), 0);
  }

  // ---- all tabs / recently closed ----
  let TL = { open: [], closed: [] };
  function renderTabList() {
    const body = $('tl-body');
    body.textContent = '';
    const q = $('tlq').value.toLowerCase().split(/\s+/).filter(Boolean);
    const ok = (t) => { const s = (t.title + ' ' + t.url).toLowerCase(); return q.every((w) => s.includes(w)); };
    const row = (t, kind) => {
      const r = document.createElement('div');
      r.className = 'trow' + (t.active ? ' active' : '');
      let fi;
      if (t.favicon) { fi = document.createElement('img'); fi.src = t.favicon; fi.onerror = () => fi.removeAttribute('src'); }
      else { fi = document.createElement('div'); fi.textContent = (t.title || '?').trim().charAt(0).toUpperCase(); }
      fi.className = 'fi';
      const tx = document.createElement('div'); tx.className = 'tx';
      const b = document.createElement('b'); b.textContent = (t.pinned ? '📌 ' : '') + (t.title || t.url);
      const sm = document.createElement('small'); sm.textContent = t.url;
      tx.append(b, sm);
      r.append(fi, tx);
      if (t.window) { const w = document.createElement('span'); w.className = 'win'; w.textContent = 'Window ' + t.window; r.append(w); }
      if (kind === 'open') {
        r.onclick = () => api.tablistSwitch(t.id);
        const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.title = 'Close tab';
        x.onclick = (e) => { e.stopPropagation(); api.tablistClose(t.id); };
        r.append(x);
      } else {
        r.onclick = () => api.tablistReopen(t.idx);
        const re = document.createElement('span'); re.className = 'win'; re.textContent = 'Reopen'; r.append(re);
      }
      return r;
    };
    const h1 = document.createElement('h4'); h1.textContent = 'Open tabs'; body.append(h1);
    const open = TL.open.filter(ok);
    open.forEach((t) => body.append(row(t, 'open')));
    if (!open.length) { const e = document.createElement('div'); e.className = 'tempty'; e.textContent = 'No matching tabs'; body.append(e); }
    const h2 = document.createElement('h4'); h2.textContent = 'Recently closed'; body.append(h2);
    const closed = TL.closed.filter(ok);
    closed.forEach((t) => body.append(row(t, 'closed')));
    if (!closed.length) { const e = document.createElement('div'); e.className = 'tempty'; e.textContent = q.length ? 'No matches' : 'Nothing closed recently'; body.append(e); }
  }
  $('tlq').addEventListener('input', renderTabList);
  $('tlq').addEventListener('keydown', (e) => { if (e.key === 'Escape') api.closeOverlay(); });
  api.onTablistData((d) => { TL = d; renderTabList(); });

  // ---- address bar suggestions ----
  api.onSuggestItems((items, sel) => {
    const box = $('suggest');
    box.textContent = '';
    items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'srow' + (i === sel ? ' sel' : '');
      const ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = it.icon || '';
      const l = document.createElement('span'); l.className = 'l'; l.textContent = it.label;
      const d = document.createElement('span'); d.className = 'd'; d.textContent = it.detail || '';
      row.append(ic, l, d);
      if (it.forgettable) {
        const x = document.createElement('span'); x.className = 'x'; x.textContent = '\u00d7'; x.title = 'Remove from history';
        x.onmousedown = (e) => { e.preventDefault(); e.stopPropagation(); api.suggestForget(it.url); };
        row.append(x);
      }
      row.onmousedown = (e) => { e.preventDefault(); api.paletteRun(it); };
      box.appendChild(row);
    });
  });

  // ---- security / site info ----
  function renderSecurity(d) {
    const box = $('security');
    box.textContent = '';
    const add = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; box.append(e); return e; };
    const titles = {
      secure: 'Connection is secure',
      insecure: 'Connection is not secure',
      warning: 'Certificate is not trusted',
      internal: 'Browser page',
    };
    add('h2', '', titles[d.level] || 'Site information');
    add('div', 'host', d.host || d.url || '');
    if (d.level === 'insecure') add('div', 'warn', 'Information you send or receive on this page could be read by others on the network. Avoid entering passwords or payment details.');
    if (d.level === 'warning') add('div', 'warn', 'You chose to open this site despite a certificate problem. The connection is encrypted but the site’s identity was not verified.');
    if (d.level === 'secure' || d.level === 'warning') {
      const kv = add('div', 'kv');
      const row = (k, v) => { const a = document.createElement('span'); a.textContent = k; const b = document.createElement('span'); b.textContent = v; kv.append(a, b); };
      if (d.cert) {
        const day = (s) => (s ? new Date(s * 1000).toLocaleDateString() : '?');
        row('Issued to', d.cert.subject || '?');
        row('Issued by', d.cert.issuer || '?');
        row('Valid', day(d.cert.validFrom) + ' to ' + day(d.cert.validTo));
        row('Check', d.cert.result || '?');
        row('Fingerprint', (d.cert.fingerprint || '').replace('sha256/', '').slice(0, 24) + '…');
      } else {
        row('Certificate', 'Details not available for this connection yet. Reload the page to capture them.');
      }
    }
    if (d.level !== 'internal') {
      add('hr');
      add('div', '', d.blockerOn ? (d.siteAllowed ? 'Tracker blocking is off for this site.' : d.blocked + ' tracker request' + (d.blocked === 1 ? '' : 's') + ' blocked on this page.') : 'Tracker blocking is off globally.');
      if (d.blockerOn) {
        const b = add('button', '', d.siteAllowed ? 'Block trackers on this site' : 'Allow trackers on this site');
        b.onclick = () => { api.toggleShield(); api.closeOverlay(); };
        if (!d.siteAllowed && d.blockedHosts && d.blockedHosts.length) {
          add('hr');
          add('div', '', 'Blocked on this page (tap Allow if a site breaks):').style.cssText = 'font-size:12px;opacity:.75;margin-bottom:4px';
          for (const bh of d.blockedHosts) {
            const r = add('div'); r.style.cssText = 'display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px';
            const nm = document.createElement('span'); nm.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'; nm.textContent = bh.host + ' ×' + bh.n + (bh.type ? ' (' + bh.type + ')' : ''); nm.title = bh.host;
            const ab = document.createElement('button'); ab.textContent = 'Allow'; ab.style.cssText = 'padding:2px 10px;font-size:12px'; ab.onclick = () => api.allowHost(bh.host);
            r.append(nm, ab);
          }
        }
      }
    }
  }

  // ---- find ----
  function doFind(forward, next) {
    const t = $('f').value;
    if (!t) { api.find('', true, false); $('count').textContent = ''; return; }
    api.find(t, forward, next && t === lastText);
    lastText = t;
  }
  $('f').addEventListener('input', () => doFind(true, false));
  $('f').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doFind(!e.shiftKey, true); }
    else if (e.key === 'Escape') { api.closeOverlay(); }
  });
  $('next').onclick = () => doFind(true, true);
  $('prev').onclick = () => doFind(false, true);
  $('close').onclick = () => api.closeOverlay();
  api.onFindResult((r) => { $('count').textContent = r.matches ? r.activeMatchOrdinal + '/' + r.matches : '0/0'; });

  // ---- bookmark popup ----
  function renderBookmark(d) {
    const box = $('bm-popup');
    box.innerHTML = '';
    const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

    const title = mk('div', 'bm-title', d.title || d.url || '');
    box.append(title);

    const lFolder = mk('label', null, 'Folder');
    // a list you pick from (no native dropdown, which opened off to the side) plus "New folder…" with its own input
    let chosen = d.folder || '';
    const list = mk('div', 'bm-folders');
    const newInput = mk('input'); newInput.type = 'text'; newInput.placeholder = 'New folder name'; newInput.style.display = 'none'; newInput.style.marginTop = '6px';
    const rows = [];
    const pick = (val, isNew) => {
      chosen = val;
      rows.forEach((r) => r.el.classList.toggle('sel', r.val === val && !!r.isNew === !!isNew));
      newInput.style.display = isNew ? 'block' : 'none'; if (box.__fit) setTimeout(box.__fit, 0);
      if (isNew) { newInput.value = ''; setTimeout(() => newInput.focus(), 0); chosen = ''; }
    };
    const add = (label, val, isNew) => {
      const el = mk('div', 'bm-f', (isNew ? '+ ' : val ? '\u{1F4C1} ' : '') + label);
      el.onclick = () => pick(val, isNew);
      list.append(el); rows.push({ el, val, isNew });
    };
    add('No folder', '', false);
    const known = (d.folders || []).slice();
    if (chosen && !known.includes(chosen)) known.push(chosen);
    for (const f of known) add(f, f, false);
    add('New folder…', '', true);
    box.append(lFolder, list, newInput);
    pick(chosen, false);
    const folderInput = { get value() { return newInput.style.display !== 'none' ? newInput.value.trim() : chosen; } };
    newInput.addEventListener('input', () => { chosen = newInput.value.trim(); });

    const sdNote = mk('div', 'bm-added');
    sdNote.textContent = d.inSpeedDial ? '✓ Already in Speed Dial' : '';
    box.append(sdNote);

    const row = mk('div', 'bm-row');
    if (!d.inSpeedDial) {
      const sdBtn = mk('button', '', '+ Speed Dial');
      sdBtn.onclick = async () => {
        const r = await api.invoke('bookmark:popup-speeddial', d.url, d.title);
        if (r && r.added) { sdNote.textContent = '✓ Added to Speed Dial'; sdBtn.remove(); }
      };
      row.append(sdBtn);
    }
    if (d.bookmarked) {
      const removeBtn = mk('button', 'danger', 'Remove');
      removeBtn.onclick = async () => {
        await api.invoke('bookmark:remove', d.url);
        api.closeOverlay();
      };
      row.append(removeBtn);
    }
    const saveBtn = mk('button', 'primary', d.bookmarked ? 'Done' : 'Bookmark');
    saveBtn.onclick = async () => {
      await api.invoke('bookmark:popup-save', d.url, d.title, folderInput.value);
      api.closeOverlay();
    };
    row.append(saveBtn);
    box.append(row);

    // Enter saves, Escape closes
    newInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); saveBtn.click(); }
      else if (e.key === 'Escape') { e.preventDefault(); api.closeOverlay(); }
    });
    const fit = () => api.overlayResize(Math.ceil(box.getBoundingClientRect().height) + 2);
    box.__fit = fit; fit(); setTimeout(fit, 60);
    box.tabIndex = -1;
    box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target === box) saveBtn.click(); else if (e.key === 'Escape') api.closeOverlay(); });
    setTimeout(() => box.focus(), 0);
  }

  // palette closes when it loses focus; the find bar stays
  window.addEventListener('blur', () => { if (mode === 'palette' || mode === 'security' || mode === 'tablist' || mode === 'bookmark') api.closeOverlay(); });
</script>
</body>
</html>
