[package]
name = "mbrowser-rs"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust + GTK + WebKitGTK take on mbrowser"

[dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_30"] }
serde_json = "1"
javascriptcore-rs = "1"
ureq = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
