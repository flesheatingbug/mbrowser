name: Rust AppImage
on:
  workflow_dispatch:
  push:
    paths: ['rust/**', '.github/workflows/rust-appimage.yml']
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2 file
      - name: Build
        working-directory: rust
        run: cargo build --release
      - name: Make AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp rust/target/release/mbrowser-rs AppDir/usr/bin/
          cp assets/icons/color-128.png AppDir/mbrowser-rs.png
          cat > AppDir/mbrowser-rs.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=mbrowser-rs
          Comment=Experimental Rust browser
          Exec=mbrowser-rs %U
          Icon=mbrowser-rs
          Categories=Network;WebBrowser;
          MimeType=x-scheme-handler/http;x-scheme-handler/https;text/html;
          EOF
          sed -i 's/^          //' AppDir/mbrowser-rs.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/mbrowser-rs" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
      - name: Pack AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir mbrowser-rs-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: mbrowser-rs-appimage
          path: mbrowser-rs-x86_64.AppImage
