name: Android APK

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mbrowser-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK as a release (downloadable from the GitHub app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mbrowser.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk mbrowser.apk --title "mbrowser Android (latest build)" --notes "Build ${GITHUB_RUN_NUMBER}. Debug build from commit ${GITHUB_SHA::7}. Install the .apk on your phone." --target "$GITHUB_SHA"
