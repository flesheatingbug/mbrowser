name: Android APK

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare the signing key
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "::error::Add the repository secret KEYSTORE_PASSPHRASE (Settings > Secrets and variables > Actions), then re-run this job."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:KEYSTORE_PASSPHRASE \
            -in android/app/mbrowser.keystore.enc -out android/app/mbrowser-ci.keystore
          echo "KEYSTORE_PASSPHRASE=$KEYSTORE_PASSPHRASE" >> "$GITHUB_ENV"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mbrowser-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK as a release (downloadable from the GitHub app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mbrowser.apk
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then RANGE="$BEFORE..HEAD"; else RANGE="-n 10"; fi
          NL=$'\n'
          CHANGES=$(git log $RANGE --pretty='format:- %s (%h)')
          retry() { for n in 1 2 3 4; do "$@" && return 0; echo "attempt $n failed, retrying"; sleep $((n*15)); done; return 1; }
          # update latest-apk in place so it never disappears while a build is publishing
          NOTES_TEXT="Build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}. Install the .apk on your phone.${NL}${NL}**Changes in this build**${NL}${CHANGES}"
          if gh release view latest-apk >/dev/null 2>&1; then
            retry gh release upload latest-apk mbrowser.apk --clobber
            gh release edit latest-apk --notes "$NOTES_TEXT" --title "mbrowser Android (latest build)" || true
            git tag -f latest-apk "$GITHUB_SHA" && git push -f origin latest-apk || true
          else
            retry gh release create latest-apk mbrowser.apk --title "mbrowser Android (latest build)" --notes "$NOTES_TEXT" --target "$GITHUB_SHA"
          fi
          # keep every build as its own numbered release so older versions stay available
          retry gh release create "apk-build-${GITHUB_RUN_NUMBER}" mbrowser.apk --prerelease --latest=false --title "mbrowser Android build ${GITHUB_RUN_NUMBER}" --notes "Archived build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}.${NL}${NL}**Changes in this build**${NL}${CHANGES}" --target "$GITHUB_SHA"
