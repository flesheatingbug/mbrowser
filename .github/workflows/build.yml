name: Build mbrowser

# Builds Windows installer + zip and Linux AppImage.
# Triggered automatically on version tags (v*) and manually from the Actions tab.
# Assets are published to a rolling "latest" release so there is always a stable download link.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ['v*']
    paths:
      - '*.js'
      - '*.html'
      - 'pages/**'
      - 'lib/**'
      - 'assets/**'
      - 'package.json'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Stamp build number and version
        shell: bash
        run: |
          sed -i "s/const BUILD_NUMBER = 0;/const BUILD_NUMBER = ${{ github.run_number }};/" main.js
          npm version "0.9.${{ github.run_number }}" --no-git-tag-version

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: npm run dist:linux

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: npm run dist:win
        env:
          # prevents winCodeSign from requiring Developer Mode on the CI runner
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mbrowser-${{ matrix.platform }}
          path: |
            dist/mbrowser-linux.AppImage
            dist/latest-linux.yml
            dist/mbrowser-windows-setup.exe
            dist/latest.yml
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish rolling desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # Use "latest-desktop" for branch pushes and manual runs; keep the tag for version tags
          if [[ "$TAG" != v* ]]; then TAG="latest-desktop"; fi

          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then RANGE="$BEFORE..HEAD"; else RANGE="-n 10"; fi
          CHANGES=$(git log $RANGE --pretty='format:- %s (%h)')

          NOTES="**Download mbrowser** — Build ${{ github.run_number }}

          | Platform | File |
          |----------|------|
          | 🐧 Linux | [mbrowser-linux.AppImage](https://github.com/${{ github.repository }}/releases/download/${TAG}/mbrowser-linux.AppImage) |
          | 🪟 Windows | [mbrowser-windows-setup.exe](https://github.com/${{ github.repository }}/releases/download/${TAG}/mbrowser-windows-setup.exe) |
          | 🤖 Android | [mbrowser.apk](https://github.com/${{ github.repository }}/releases/download/latest-apk/mbrowser.apk) |

          Build ${{ github.run_number }} from commit \`${GITHUB_SHA::7}\`.

          **Changes in this build**
          ${CHANGES}"

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release-assets/* \
            --title "mbrowser Build ${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
