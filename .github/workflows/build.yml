# Builds the Windows installer (+ zip) and the Linux AppImage on GitHub's servers.
# Run it from the repository's "Actions" tab (Build mbrowser > Run workflow), or push a tag like v0.6.0.
# Download the results from the finished run under "Artifacts".
name: Build mbrowser
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: mbrowser-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error
