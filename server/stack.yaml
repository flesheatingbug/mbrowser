---
# mbrowser sync server — stack file for Dockhand, Dockge, Portainer or any Compose tool.
# Paste this into a new stack (or save it as compose.yaml in your stacks folder).
# Image is built automatically from the GitHub repo and published to GHCR.
#
# First run: open http://<your-server>:4242 and create your admin account.
# Browser config: Settings → Sync → Server address → http://<your-server>:4242
#
# Maintenance:
#   docker exec mbrowser-sync python -m app.cli list-users
#   docker exec mbrowser-sync python -m app.cli reset-password <username>

services:
  mbrowser-sync:
    image: ghcr.io/flesheatingbug/mbrowser-sync:latest
    container_name: mbrowser-sync
    environment:
      # ── file ownership (run `id` on the host to get your numbers) ──
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London

      # ── optional: auto-create the first admin account ──
      # Leave blank to create it via the web UI on first run instead.
      - ADMIN_USER=
      - ADMIN_PASSWORD=

      # ── reverse proxy ──
      # true = trust X-Forwarded-For / X-Forwarded-Proto (Nginx Proxy Manager, Traefik, etc.)
      - TRUST_PROXY=true

      # ── home network (beta) ──
      # true = let signed-in browsers reach private LAN addresses (192.168.x, 10.x, 172.16-31.x)
      # through this server. Anyone holding a sync key can then reach your LAN, so guard keys.
      # Behind Nginx Proxy Manager turn on "Websockets support" for the proxy host.
      - ALLOW_TUNNEL=false
      # Strongly recommended with the tunnel: only these networks/addresses are reachable (comma separated).
      # Leave empty and every private address is reachable, including other containers on this Docker host.
      - TUNNEL_ALLOW=

      # days a web-UI login stays valid
      - SESSION_DAYS=7

    volumes:
      # Data directory — change this to wherever you want to store the database and config.
      # Examples:
      #   /opt/mbrowser-sync/data:/config
      #   /home/youruser/mbrowser:/config
      #   /mnt/storage/appdata/mbrowser-sync:/config
      - /opt/mbrowser-sync/data:/config

    ports:
      # host:container — remove this block entirely when using a reverse proxy on a shared Docker network
      - 4242:4242

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4242/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ── Nginx Proxy Manager (or any other reverse proxy on a shared network) ──
    # 1. Remove the "ports" block above.
    # 2. Uncomment the lines below and change "myown" to your proxy's Docker network name.
    # networks:
    #   - myown

# networks:
#   myown:
#     external: true
